    const BK = [['منتهٍ', '#DD6A49'], ['خلال 7 أيام', '#E0894F'], ['خلال 30 يومًا', '#E8B04B'], ['خلال 90 يومًا', '#4A8FDB'], ['أكثر من 90 يومًا', '#22A285'], ['دون تاريخ', '#5C7480']];
    const bks = BK.map(() => 0); for (const b of act) bks[bk(b)] += b.rem;
    // حسب الصنف
    const byMat = new Map(); for (const b of act) { const o = byMat.get(b.mat) || { ok: 0, near: 0, bad: 0 }; if (b.code === 'expired') o.bad += b.rem; else if (b.code === 'urgent' || b.code === 'soon') o.near += b.rem; else o.ok += b.rem; byMat.set(b.mat, o); }
    const mats = [...byMat.entries()].sort((a, b) => (b[1].ok + b[1].near + b[1].bad) - (a[1].ok + a[1].near + a[1].bad)).slice(0, 8);

        al.push(['warnbox', `آخر تحويل من ${esc(mat)} كان من الدفعة ${esc(last.bno)}، بينما الدفعة ${esc(g[0].no)} تنتهي قبلها (<span dir="ltr">${g[0].exp}</span>).`]); break; }

    const near10 = [...act].sort((a, b) => (a.exp || '9999').localeCompare(b.exp || '9999')).slice(0, 10);

    return head + cmpHead(c, `<span class="box">📦 الرصيد والصلاحية كما هما اليوم ${dlabel(today())}</span>`) + `

      ${card('سلامة الرصيد', 'نسبة الرصيد غير المنتهي — الهدف 100%', gaugeSVG(validPct, 'من الرصيد غير منتهٍ', gcol), 's3')}

  // ---------------- استلام دفعة ----------------
  nextNo(prefix, rows, col) { let mx = 0; const re = new RegExp('^' + prefix + '(\\d+)$'); for (const x of rows) { const m = re.exec(x[col]); if (m) mx = Math.max(mx, +m[1]); } return prefix + String(mx + 1).padStart(4, '0'); },

      <div class="f"><label><input type="checkbox" data-k="${p}.hasProd" ${st.hasProd === '1' ? 'checked' : ''} data-cb="1"> يوجد تاريخ إنتاج</label>
        <input type="date" data-k="${p}.prod" value="${esc(st.prod)}" ${st.hasProd === '1' ? '' : 'disabled'}></div>
      <div class="f"><label><input type="checkbox" data-k="${p}.hasExp" ${st.hasExp === '1' ? 'checked' : ''} data-cb="1"> يوجد تاريخ انتهاء</label>

      <div class="f"><label>وزن العبوة (كجم) *</label><input type="number" min="0" step="any" inputmode="decimal" data-k="${p}.w" value="${esc(st.w)}"></div>
      <div class="f"><label>عدد العبوات *</label><input type="number" min="0" step="1" inputmode="numeric" data-k="${p}.bags" value="${esc(st.bags)}"></div>
      <div class="f full"><div class="infobox" style="margin:0">الكمية الكلية: <b id="${p.replace('.', '-')}-tot">${kgf(total)}</b></div></div>
      <div class="f full"><label>ملاحظات</label><textarea rows="2" data-k="${p}.notes">${esc(st.notes)}</textarea></div></div>`;
  },
  batchErrs(st) {
    const e = [];
    if (!st.fac) e.push('المصنع مطلوب'); if (!st.mat) e.push('الصنف مطلوب'); if (!st.wh) e.push('المخزن مطلوب');
    if (!st.arr) e.push('تاريخ الوصول مطلوب');
    if (!(+st.w > 0)) e.push('يجب أن يكون الوزن أكبر من صفر');
    if (!(+st.bags > 0) || !Number.isInteger(+st.bags)) e.push('يجب أن يكون عدد العبوات رقمًا صحيحًا أكبر من صفر');
    if (st.hasProd === '1' && !st.prod) e.push('اكتب تاريخ الإنتاج أو ألغِ اختياره');
    if (st.hasExp === '1' && !st.exp) e.push('اكتب تاريخ الانتهاء أو ألغِ اختياره');
    if (st.hasProd === '1' && st.hasExp === '1' && st.prod && st.exp && st.exp <= st.prod) e.push('يجب أن يكون تاريخ الانتهاء بعد تاريخ الإنتاج');
    return e;
  },
  batchRow(st) {
    const w = +st.w, bags = +st.bags;
    return { factory_id: +st.fac, material_id: +st.mat, warehouse_id: +st.wh, arrival_date: st.arr, prod_date: st.hasProd === '1' ? st.prod : null,
      expiry_date: st.hasExp === '1' ? st.exp : null, weight_per_bag: w, bags, total_qty: Math.round(w * bags * 1000) / 1000, notes: st.notes.trim() || null };
  },
  recv() {
    const st = this.st.recv;
    if (!st.no) st.no = this.nextNo('BATCH-', T.batches.rows, 'batch_no');
    if (!st.arr) st.arr = today(); if (!st.prod) st.prod = today(); if (!st.exp) st.exp = addDays(today(), 180);
    LS.set('qw_mt_fac', st.fac);
    return `<div class="card"><h3>استلام دفعة جديدة</h3><div class="sub">بعد الحفظ يبقى المصنع والصنف والمخزن والتواريخ كما هي، لتسجيل الدفعة التالية بسرعة.</div><div id="add-msg"></div>
      <div class="form" style="margin-bottom:14px"><div class="f full"><label>رقم الدفعة *</label><input data-k="mt.recv.no" value="${esc(st.no)}" dir="ltr"></div></div>
      ${this.batchForm(st, 'mt.recv')}
      <div style="margin-top:16px"><button class="btn" data-act="mt-save-batch" style="min-width:220px">حفظ الدفعة</button></div></div>`;
  },
  async saveBatch(btn) {
    const st = this.st.recv, box = $('#add-msg'), e = this.batchErrs(st);
    if (!st.no.trim()) e.unshift('رقم الدفعة مطلوب');
    else if (T.batches.rows.some(b => b.batch_no.trim().toLowerCase() === st.no.trim().toLowerCase())) e.unshift(`رقم الدفعة ${esc(st.no)} مستخدم سابقًا`);
    if (e.length) { box.innerHTML = `<div class="err">${e.join('<br>')}</div>`; return; }
    btn.disabled = true;
    try {
      const row = await API.insert('batches', { batch_no: st.no.trim(), ...this.batchRow(st), created_by: Data.me.username, created_at: nowKw() });
      T.batches.put(row); log('materials', 'استلام دفعة', `${row.batch_no} | ${fmt(row.total_qty)}`);
      toast(`✓ تم حفظ الدفعة ${row.batch_no} بكمية ${kgf(row.total_qty)}`);
      Object.assign(st, { no: '', bags: '', notes: '' }); App.render();
    } catch (er) {
      box.innerHTML = `<div class="err">${er.code === '23505' ? `رقم الدفعة ${esc(st.no)} مستخدم سابقًا` : esc(arErr(er))}</div>`; btn.disabled = false;
    }
  },
  openEditBatch(id) {
    const b = this.batches().find(x => x.id === id); if (!b) return;
    this.st.edit = { fac: String(b.fid ?? ''), mat: String(b.mid), wh: String(b.wid), arr: b.arr, hasProd: b.prod ? '1' : '', prod: b.prod || today(), hasExp: b.exp ? '1' : '',
      exp: b.exp || addDays(today(), 180), w: String(b.w), bags: String(b.bags), notes: b.notes };
    this.editId = id;
    modal(`<h3>تعديل الدفعة ${esc(b.no)}</h3><div class="sub">المحوَّل من هذه الدفعة: ${kgf(b.issued)}</div><div id="edit-msg"></div><div id="edit-form">${this.batchForm(this.st.edit, 'mt.edit', b)}</div>
      <div style="display:flex;gap:10px;margin-top:16px"><button class="btn" data-act="mt-save-edit">حفظ</button><button class="btn ghost" data-act="close">إلغاء</button></div>`);
  },
  refreshEdit() { const b = this.batches().find(x => x.id === this.editId); $('#edit-form').innerHTML = this.batchForm(this.st.edit, 'mt.edit', b); },
  async saveEditBatch(btn) {
    const st = this.st.edit, b = this.batches().find(x => x.id === this.editId), box = $('#edit-msg'), e = this.batchErrs(st), row = this.batchRow(st);
    if (row.total_qty < b.issued - 1e-9) e.push(`الكمية الجديدة (${fmt(row.total_qty)}) أقل من المحوَّل (${fmt(b.issued)})`);
    if (e.length) { box.innerHTML = `<div class="err">${e.join('<br>')}</div>`; return; }
    btn.disabled = true;
    try {
      const r = await API.update('batches', b.id, { ...row, updated_by: Data.me.username, updated_at: nowKw() });
      T.batches.put(r); log('materials', 'تعديل دفعة', b.no); closeModal(); toast('✓ تم حفظ التعديلات'); App.render();
    } catch (er) { box.innerHTML = `<div class="err">${esc(arErr(er))}</div>`; btn.disabled = false; }
  },
  confirmDelBatch(id) {
    const b = this.batches().find(x => x.id === id); if (!b) return;
    const isChild = T.issues.rows.some(i => i.child_batch_id === id), n = T.issues.rows.filter(i => i.batch_id === id).length;
    const why = isChild ? 'هذه الدفعة ناتجة عن تحويل داخلي؛ احذف سند التحويل من «سجل التحويلات» بدلًا من ذلك.'
      : n ? `لا يمكن حذف الدفعة لأن عليها ${n} سند تحويل. احذف السندات أولًا.` : '';
    modal(`<h3>حذف الدفعة ${esc(b.no)}</h3>${why ? `<div class="err">${why}</div><button class="btn ghost" data-act="close">إغلاق</button>`
      : `<p>هل أنت متأكد من حذف الدفعة <b>${esc(b.no)}</b>؟<br>${esc(b.mat)} — ${esc(b.wh)} — ${kgf(b.total)}</p><div id="del-msg"></div>
      <div style="display:flex;gap:10px"><button class="btn danger" data-act="mt-do-del-batch" data-id="${id}">نعم، احذف</button><button class="btn ghost" data-act="close">إلغاء</button></div>`}`, 480);
  },
  async doDelBatch(id, btn) {
    const b = this.batches().find(x => x.id === id); btn.disabled = true;
    try { await API.remove('batches', id); T.batches.drop(id); log('materials', 'حذف دفعة', b.no); closeModal(); toast('✓ تم حذف ' + b.no); App.render(); }
    catch (er) { $('#del-msg').innerHTML = `<div class="err">${esc(arErr(er))}</div>`; btn.disabled = false; }
  },

  // ---------------- تحويل ----------------
  issue() {
    const st = this.st.issue;
    if (!st.no) st.no = this.nextNo('TRF-', T.issues.rows, 'issue_no');
    if (!st.date) st.date = today();
    LS.set('qw_mt_fac', st.fac);
    const head = `<div class="card"><h3>سند تحويل</h3><div class="sub">اختر المصنع أولًا، ثم الدفعة والمخزن المستلم. التحويل إلى مخزن من مخازنك ينقل الكمية ويبقيها في رصيدك، أما التحويل إلى مخزن الإنتاج فيُخرجها من رصيدك ولا يتابعها البرنامج بعد ذلك.</div>
      <div id="add-msg"></div><div class="form">${sel('mt.issue.fac', st.fac, this.facOptions(), { label: 'المصنع *', all: '— اختر المصنع —', cls: 'full' })}`;
    if (!st.fac) return head + '</div><div class="infobox" style="margin-top:12px">اختر المصنع لعرض دفعاته المتاحة.</div></div>';
    const avail = this.batches().filter(b => b.rem > 0.0001 && String(b.fid) === String(st.fac))
      .sort((a, b) => a.mat.localeCompare(b.mat) || (a.exp || '9999').localeCompare(b.exp || '9999'));
    if (!avail.length) return head + '</div><div class="warnbox" style="margin-top:12px">لا توجد أرصدة متاحة لهذا المصنع.</div></div>';
    if (st.batch && !avail.some(b => String(b.id) === String(st.batch))) st.batch = '';
    const b = avail.find(x => String(x.id) === String(st.batch));
    let notes = '';
    if (b) {
      notes += `<div class="infobox">من: <b>${esc(b.wh)}</b> — المتاح <b>${kgf(b.rem)}</b> — ${mpill(b.code)}</div>`;
      if (b.code === 'expired') notes += '<div class="err"><b>هذه الدفعة منتهية الصلاحية.</b> تحقق قبل التحويل.</div>';
      const older = avail.find(x => x.mid === b.mid && x.exp && b.exp && x.exp < b.exp);
      if (older) notes += `<div class="warnbox">توجد دفعة من الصنف نفسه تنتهي قبلها: <b>${esc(older.no)}</b> (<span dir="ltr">${older.exp}</span>). يُفضّل التحويل منها أولًا.</div>`;
    }
    const dests = [...this.whOptions().filter(([id]) => !b || id !== b.wid).map(([id, n]) => ['w:' + id, '🏬 ' + n + '  (يبقى في رصيدي)']),
      ...T.prodwh.rows.filter(p => p.active).map(p => ['p:' + p.id, '🏭 ' + p.name + '  (يخرج إلى الإنتاج)'])];
    if (st.dest && !dests.some(d => d[0] === st.dest)) st.dest = '';
    return head + `<div class="f"><label>رقم التحويل *</label><input data-k="mt.issue.no" value="${esc(st.no)}" dir="ltr"></div>
        <div class="f"><label>تاريخ التحويل *</label><input type="date" data-k="mt.issue.date" value="${esc(st.date)}" max="${today()}"></div>
        ${sel('mt.issue.batch', st.batch, avail.map(x => [x.id, `${x.no} | ${this.matLabel({ name: x.mat, description: x.mdesc })} | ${x.wh} | ${kgf(x.rem)} | ${MST[x.code][0]}`]), { label: 'الدفعة (من مخزن) *', all: '— اختر —', cls: 'full' })}
        ${notes ? `<div class="f full">${notes}</div>` : ''}
        ${sel('mt.issue.dest', st.dest, dests, { label: 'إلى مخزن *', all: '— اختر —' })}
        <div class="f"><label>الكمية (كجم) *</label><input type="number" min="0" step="any" inputmode="decimal" data-k="mt.issue.qty" value="${esc(st.qty)}"></div>
        <div class="f full"><label>ملاحظات</label><textarea rows="2" data-k="mt.issue.notes">${esc(st.notes)}</textarea></div></div>
      <div style="margin-top:16px"><button class="btn" data-act="mt-save-issue" style="min-width:220px">حفظ التحويل</button></div></div>`;
  },
  async saveIssue(btn) {
    const st = this.st.issue, box = $('#add-msg'), e = [];
    if (!st.no.trim()) e.push('رقم التحويل مطلوب');
    else if (T.issues.rows.some(i => i.issue_no.trim().toLowerCase() === st.no.trim().toLowerCase())) e.push(`رقم التحويل ${esc(st.no)} مستخدم سابقًا`);
    if (!st.date) e.push('التاريخ مطلوب'); else if (st.date > today()) e.push('التاريخ لا يمكن أن يكون في المستقبل');
    if (!st.batch) e.push('الدفعة مطلوبة'); if (!st.dest) e.push('المخزن المستلم مطلوب');
    if (!(+st.qty > 0)) e.push('يجب أن تكون الكمية أكبر من صفر');
    const b = this.batches().find(x => String(x.id) === String(st.batch));
    if (b && +st.qty > b.rem + 1e-9) e.push(`الكمية (${fmt(+st.qty)}) أكبر من المتاح (${fmt(b.rem)})`);
    if (e.length) { box.innerHTML = `<div class="err">${e.join('<br>')}</div>`; return; }
    const [k, did] = st.dest.split(':');
    btn.disabled = true;
    try {
      const res = await API.rpc('mat_transfer', { p_no: st.no.trim(), p_date: st.date, p_batch: +st.batch, p_qty: +st.qty, p_kind: k === 'w' ? 'internal' : 'prod',
        p_dest: +did, p_factory: +st.fac, p_notes: st.notes, p_now: nowKw() });
      T.issues.put(res.issue); if (res.child) T.batches.put(res.child);
      const q = +res.issue.qty, to = res.issue.issued_to;
      log('materials', k === 'w' ? 'تحويل داخلي' : 'تحويل للإنتاج', `${res.issue.issue_no} | ${fmt(q)} | ${to}`);
      toast(k === 'w' ? `✓ تم نقل ${kgf(q)} إلى ${to}، وما زالت في رصيدك` : `✓ تم تحويل ${kgf(q)} إلى ${to}`);
      Object.assign(st, { no: '', batch: '', dest: '', qty: '', notes: '' }); App.render();
    } catch (er) {
      const msg = `<div class="err">${er.code === '23505' ? `رقم التحويل ${esc(st.no)} مستخدم سابقًا` : esc(arErr(er))}</div>`;
      btn.disabled = false; box.innerHTML = msg;
      await App.sync(true); const b2 = $('#add-msg'); if (b2) b2.innerHTML = msg;   // نحدّث المتاح ونُبقي الرسالة ظاهرة
    }
  },

  // ---------------- المخزون ----------------
  stockRows(st) {
    let d = this.byFac(this.batches(), st.fac);
    if (st.show === 'active') d = d.filter(b => b.rem > 0.0001); else if (st.show === 'expired') d = d.filter(b => b.rem > 0.0001 && b.code === 'expired');
    else if (st.show === 'near') d = d.filter(b => b.rem > 0.0001 && (b.code === 'expired' || b.code === 'urgent' || b.code === 'soon'));
    if (st.mat) d = d.filter(b => String(b.mid) === String(st.mat));
    if (st.wh) d = d.filter(b => String(b.wid) === String(st.wh));
    if (st.q) { const q = st.q.trim().toLowerCase(); d = d.filter(b => [b.no, b.mat, b.mdesc, b.notes].some(v => String(v).toLowerCase().includes(q))); }
    return d;
  },
  stock() {
    const st = this.st.stock, lv = Data.level('materials'), all = this.byFac(this.batches(), st.fac);
    if (!this.batches().length) return '<div class="empty">لا توجد دفعات</div>';

    const mats = [...new Map(all.map(b => [b.mid, b.mat])).entries()].sort((a, b) => a[1].localeCompare(b[1]));
    const whs = [...new Map(all.map(b => [b.wid, b.wh])).entries()];

        ${sel('mt.stock.show', st.show, [['active', 'فيها رصيد'], ['near', 'منتهية أو قريبة الانتهاء'], ['expired', 'المنتهية فقط'], ['all', 'كل الدفعات (مع المستنفدة)']], { label: 'عرض' })}
        <div class="f" style="flex:1"><label>بحث</label><input data-k="mt.stock.q" data-live="1" value="${esc(st.q)}" placeholder="رقم الدفعة، الصنف..."></div></div>
      <div class="period"><b>${fmt(d.length)} دفعة — رصيد ${kgf(d.reduce((s, b) => s + b.rem, 0))}</b><button class="btn ghost sm" data-act="mt-export-stock">⬇️ تنزيل Excel (CSV)</button></div>
      ${d.length ? `<div class="tbl"><table><thead><tr><th>رقم الدفعة</th><th>كود الصنف</th><th>الوصف</th><th>المصنع</th><th>المخزن</th><th>تاريخ الانتهاء</th><th class="num">الأيام المتبقية</th><th>الحالة</th>
        <th class="num">الكلية (كجم)</th><th class="num">المحوَّل</th><th class="num">المتبقي</th><th>الوصول</th><th>الإنتاج</th>${lv >= 3 ? '<th></th>' : ''}</tr></thead><tbody>
        ${d.map(b => `<tr><td>${esc(b.no)}</td><td>${esc(b.mat)}</td><td>${esc(b.mdesc)}</td><td>${esc(b.fac)}</td><td>${esc(b.wh)}</td><td>${b.exp || '—'}</td><td class="num">${b.left ?? '—'}</td><td>${mpill(b.code)}</td>
          <td class="num">${fmt(b.total)}</td><td class="num">${fmt(b.issued)}</td><td class="num"><b>${fmt(b.rem)}</b></td><td>${b.arr || '—'}</td><td>${b.prod || '—'}</td>
          ${lv >= 3 ? `<td style="white-space:nowrap"><button class="btn ghost sm" data-act="mt-edit-batch" data-id="${b.id}">تعديل</button> <button class="btn ghost sm" data-act="mt-del-batch" data-id="${b.id}">حذف</button></td>` : ''}</tr>`).join('')}
        </tbody></table></div>` : '<div class="empty">لا توجد دفعات مطابقة</div>'}`;
  },

  // ---------------- سجل التحويلات ----------------
  logRows(st) {
    let d = this.issues(); const [f, t] = presetRange(st, d.map(i => i.date));
    d = this.byFac(d.filter(i => i.date >= f && i.date <= t), st.fac);
    if (st.kind) d = d.filter(i => i.kind === st.kind);
    if (st.q) { const q = st.q.trim().toLowerCase(); d = d.filter(i => [i.no, i.bno, i.mat, i.to, i.notes, i.by].some(v => String(v).toLowerCase().includes(q))); }
    return [d, f, t];
  },
  log() {
    const st = this.st.log, lv = Data.level('materials'), [d, f, t] = this.logRows(st);

        <div class="f" style="flex:1"><label>بحث</label><input data-k="mt.log.q" data-live="1" value="${esc(st.q)}" placeholder="رقم التحويل أو الدفعة..."></div></div>
      <div class="period"><b>${fmt(d.length)} سند — الإجمالي ${kgf(d.reduce((s, i) => s + i.qty, 0))}</b><span class="mut">${spanText(f, t)}</span><button class="btn ghost sm" data-act="mt-export-log">⬇️ تنزيل Excel (CSV)</button></div>
      ${d.length ? `<div class="tbl"><table><thead><tr><th>رقم التحويل</th><th>التاريخ</th><th>المصنع</th><th>النوع</th><th>رقم الدفعة</th><th>كود الصنف</th><th>من مخزن</th><th>إلى مخزن</th><th class="num">الكمية (كجم)</th><th>ملاحظات</th><th>سجّلها</th>${lv >= 3 ? '<th></th>' : ''}</tr></thead><tbody>
        ${view.map(i => `<tr><td>${esc(i.no)}</td><td>${i.date}</td><td>${esc(i.fac)}</td><td>${i.kind === 'internal' ? '🏬 بين مخازني' : '🏭 إلى الإنتاج'}</td><td>${esc(i.bno)}</td><td>${esc(i.mat)}</td><td>${esc(i.wh)}</td><td>${esc(i.to)}</td>
          <td class="num"><b>${fmt(i.qty)}</b></td><td>${esc(i.notes)}</td><td>${esc(i.by)}</td>
          ${lv >= 3 ? `<td style="white-space:nowrap"><button class="btn ghost sm" data-act="mt-edit-issue" data-id="${i.id}">تعديل</button> <button class="btn ghost sm" data-act="mt-del-issue" data-id="${i.id}">حذف</button></td>` : ''}</tr>`).join('')}
        </tbody></table></div>
        <div class="pager"><span>صفحة ${st.page + 1} من ${pages}</span><span><button class="btn ghost sm" data-act="mt-pg" data-d="-1" ${st.page ? '' : 'disabled'}>السابق</button>
        <button class="btn ghost sm" data-act="mt-pg" data-d="1" ${st.page < pages - 1 ? '' : 'disabled'}>التالي</button></span></div>` : '<div class="empty">لا توجد تحويلات مطابقة</div>'}`;
  },
  openEditIssue(id) {

    const [I, f, t] = (() => { let d = this.byFac(this.issues(), st.fac); const [f, t] = presetRange(st, d.map(i => i.date)); return [d.filter(i => i.date >= f && i.date <= t), f, t]; })();

  async saveList(rowSel, attr, table, key, fields, box, what) {
    const ch = [];
    for (const tr of $$(rowSel)) {
      const id = +tr.dataset[attr], o = T[key].rows.find(x => x.id === id), p = {};

      ...Materials.stockRows(Materials.st.stock).map(b => [b.no, b.mat, b.mdesc, b.fac, b.wh, b.exp, b.left ?? '', MST[b.code][0], b.total, b.issued, b.rem, b.arr, b.prod, b.notes])]),
    'export-log': () => download(`transfers_${today()}.csv`, [['رقم التحويل', 'التاريخ', 'المصنع', 'النوع', 'رقم الدفعة', 'كود الصنف', 'وصف الصنف', 'من مخزن', 'إلى مخزن', 'الكمية (كجم)', 'ملاحظات', 'سجّلها'],
      ...Materials.logRows(Materials.st.log)[0].map(i => [i.no, i.date, i.fac, i.kind === 'internal' ? 'بين مخازني' : 'إلى الإنتاج', i.bno, i.mat, i.mdesc, i.wh, i.to, i.qty, i.notes, i.by])]),
    'export-piv': () => { const R = Materials._rep; if (R) download(`stock_by_wh_${today()}.csv`, [['كود الصنف', 'الوصف', ...R.whs.map(w => w[1]), 'الإجمالي (كجم)'],
      ...R.pivRows.map(([k, o]) => [k, o.d, ...R.whs.map(([id]) => o.w[id] || 0), Object.values(o.w).reduce((s, v) => s + v, 0)])]); },
    'export-near': () => { const R = Materials._rep; if (R) download(`expiry_${today()}.csv`, [['رقم الدفعة', 'كود الصنف', 'المخزن', 'تاريخ الانتهاء', 'الأيام المتبقية', 'الحالة', 'المتبقي (كجم)'],
      ...R.near.map(b => [b.no, b.mat, b.wh, b.exp, b.left, MST[b.code][0], b.rem])]); },
    'save-thr': async () => {

      if (c >= w) { box.innerHTML = '<div class="err">يجب أن تكون مدة التحذير العاجل أقل من مدة التنبيه</div>'; return; }
      try { await API.upsert('settings', [{ key: 'mat_warning_days', value: String(w) }, { key: 'mat_critical_days', value: String(c) }], 'key'); await T.settings.sync();
        log('materials', 'تعديل إعدادات التنبيه', `${w}/${c}`); toast('✓ تم الحفظ'); App.render(); }
      catch (er) { box.innerHTML = `<div class="err">${esc(arErr(er))}</div>`; }

      catch (er) { box.innerHTML = `<div class="err">${er.code === '23505' ? 'هذا الكود موجود بالفعل' : esc(arErr(er))}</div>`; }

      catch (er) { box.innerHTML = `<div class="err">${er.code === '23505' ? 'هذا الاسم موجود بالفعل' : esc(arErr(er))}</div>`; }

};
// الكمية الكلية في نموذج الدفعة تتحدث فورًا
document.addEventListener('input', e => {
  const k = e.target.dataset && e.target.dataset.k; if (!k || !/^mt\.(recv|edit)\.(w|bags)$/.test(k)) return;
  const g = k.split('.')[1], st = Materials.st[g]; st[k.split('.')[2]] = e.target.value;
  const el = $(`#mt-${g}-tot`); if (el) el.textContent = kgf((+st.w || 0) * (+st.bags || 0));
});
// ============================================================================
// قسم مؤشر الأداء القياسي (دقة الجرد): سجل لكل عامل في كل جرد
// ============================================================================
const LINE_COLORS = ['#9177E8', '#22A285', '#4A8FDB', '#BC8726', '#DD6A49', '#B5739D'];
const accOf = (items, errs) => items > 0 ? Math.round((items - Math.min(errs, items)) / items * 10000) / 100 : 0;
const pct = (v, d = 2) => v === null || v === undefined ? '—' : fmt(v, d) + '%';
// بداية الأسبوع (الاثنين) لتاريخ
const weekStart = s => { const x = D(s), wd = (x.getUTCDay() + 6) % 7; return addDays(s, -wd); };

const Performance = {
  key: 'performance', title: 'مؤشر الأداء القياسي', icon: '🎯', tables: ['perf', 'settings'],
  st: {
    tab: LS.get('qw_pf_tab', 'dash'),
    dash: { kind: 'month', p: '' },
    add: { date: '', wh: LS.get('qw_pf_wh', ''), wk: '', items: '', errs: '', notes: '' },
    list: { preset: 'month', f: '', t: '', wk: '', wh: '', page: 0 },
    rep: { preset: 'six', f: '', t: '' },
    edit: {},
  },
  quiet(grp, k) { return grp === 'edit' || (grp === 'add' && ['items', 'errs', 'notes', 'date'].includes(k)); },
  thr() { return [+setting('perf_daily_threshold', 90) || 90, +setting('perf_monthly_threshold', 95) || 95]; },
  workers(keep) { return [...Data.emp.values()].filter(e => (e.in_performance && e.active) || e.id === keep).sort(byName); },
  rows() {
    const t = T.perf, v = t.v + '.' + Data.lv;
    if (this._v === v) return this._rows;
    this._rows = t.rows.map(r => ({ id: r.id, no: r.record_no, date: r.date, ym: r.date.slice(0, 7), wid: r.warehouse_id, wh: (Data.wh.get(r.warehouse_id) || {}).name || '?',
      kid: r.worker_id, wk: (Data.emp.get(r.worker_id) || {}).name || '?', items: +r.items_count || 0, errs: +r.errors || 0, acc: +r.accuracy || 0, notes: r.notes || '', by: r.created_by || '' }))
      .sort((a, b) => a.date < b.date ? 1 : a.date > b.date ? -1 : b.id - a.id);
    this._v = v; return this._rows;
  },
  // الدقة المرجّحة = (إجمالي الأصناف − إجمالي الأخطاء) ÷ إجمالي الأصناف
  wacc(rows) { return accOf(rows.reduce((s, r) => s + r.items, 0), rows.reduce((s, r) => s + r.errs, 0)); },
  ranking(rows) {
    const m = new Map();
    for (const r of rows) { const o = m.get(r.wk) || { wk: r.wk, n: 0, items: 0, errs: 0, hi: -1, lo: 101 }; o.n++; o.items += r.items; o.errs += r.errs; o.hi = Math.max(o.hi, r.acc); o.lo = Math.min(o.lo, r.acc); m.set(r.wk, o); }
    return [...m.values()].map(o => ({ ...o, acc: accOf(o.items, o.errs) })).sort((a, b) => b.acc - a.acc || b.n - a.n);
  },
  render() {
    const lv = Data.level('performance');
    if (lv < 1) return `<div class="err">ليست لديك صلاحية على قسم مؤشر الأداء القياسي. اطلبها من المدير.</div>`;
    const tabs = [['dash', 'لوحة المعلومات'], ...(lv >= 2 ? [['add', 'تسجيل جرد']] : []), ['list', 'السجلات'], ['rep', 'التقارير'], ...(lv >= 3 ? [['set', 'الإعدادات']] : [])];
    if (!tabs.some(t => t[0] === this.st.tab)) this.st.tab = 'dash';
    return tabsBar(tabs, this.st.tab, 'pf') + this[this.st.tab]();
  },

  // ---------------- لوحة المعلومات ----------------
  dash() {
    const st = this.st.dash, all = this.rows();
    if (!all.length) return `<div class="card hero"><h2>لا توجد بيانات بعد</h2><p>ابدأ بتسجيل أول جرد من تبويب «تسجيل جرد».</p></div>`;
    const [dayT, monT] = this.thr();
    const c = cmpPeriod(st, all.map(r => r.date)), cur = all.filter(r => r.date >= c.f && r.date <= c.t), prev = all.filter(r => r.date >= c.pf && r.date <= c.pt);
    const acc = this.wacc(cur), pacc = prev.length ? this.wacc(prev) : null, rank = this.ranking(cur), best = rank[0];
    const above = rank.filter(r => r.acc >= monT).length, errs = cur.reduce((s, r) => s + r.errs, 0), items = cur.reduce((s, r) => s + r.items, 0);
    const worstShare = errs ? Math.max(...rank.map(r => r.errs)) / errs * 100 : 0;
    const head = `<div class="filters">${periodPicker('pf.dash', st, c)}</div>${cmpHead(c)}`;
    // تطور أسبوعي: آخر 8 أسابيع لأفضل 5 عمال
    const from = addDays(today(), -56), recent = all.filter(r => r.date >= from);
    const weeks = [...new Set(recent.map(r => weekStart(r.date)))].sort();
    const top5 = (rank.length ? rank : this.ranking(recent)).slice(0, 5).map(r => r.wk);
    const wser = top5.map((w, i) => [w, weeks.map(k => { const x = recent.filter(r => r.wk === w && weekStart(r.date) === k); return x.length ? this.wacc(x) : null; }), LINE_COLORS[i % LINE_COLORS.length]]);
    // حسب المخزن
    const byWh = [...new Set(cur.map(r => r.wh))].map(w => { const x = cur.filter(r => r.wh === w); return [w, this.wacc(x)]; }).sort((a, b) => b[1] - a[1]);
    // تنبيهات
    const al = rank.filter(r => r.acc < monT).map(r => ['err', `<b>${esc(r.wk)}</b> دون حد ${fmt(monT)}% هذا الشهر (${pct(r.acc, 1)}). يُقترح تدريب أو مراجعة طريقة الجرد.`]);
    const dLow = cur.filter(r => r.acc < dayT);
    if (dLow.length) { const top = sortDesc(groupSum(dLow, r => r.wh, () => 1))[0]; al.push(['warnbox', `${dLow.length} جرد يومي أقل من ${fmt(dayT)}% هذا الشهر، منها ${top[1]} في ${esc(top[0])}.`]); }
    const medal = ['🥇', '🥈', '🥉'];
    const chg = vsLY(acc, pacc, { points: true, dec: 1, unit: '%' });
    if (!cur.length) return head + `<div class="card hero"><h2>لا توجد سجلات في ${c.name}</h2></div>`;
    return head + `<div class="grid g12">
      <div class="card hero s12"><h2>دقة الجرد في ${c.name}: <bdi>${pct(acc, 1)}</bdi></h2>
        <p>الدقة محسوبة على إجمالي الأصناف والأخطاء، وليست متوسط نسب. ${above} من ${rank.length} عمال فوق حد ${fmt(monT)}%، والأفضل هذا الشهر <b>${esc(best.wk)}</b>.</p>
        <div class="chips"><span class="chip">${cur.length} جرد</span><span class="chip">${fmt(items)} صنف مجرود</span>${pacc !== null ? `<span class="chip">العام الماضي ${pct(pacc, 1)}</span>` : ''}</div></div>
      <div class="s12 grid g4">
        ${kpi('دقة الشهر', pct(acc, 1), chg, acc >= monT ? 'st-good' : 'st-bad')}
        ${kpi('عدد الجردات', fmt(cur.length), `<span class="mut">على ${new Set(cur.map(r => r.date)).size} يوم عمل</span>`)}
        ${kpi('إجمالي الأخطاء', fmt(errs), `<span class="${worstShare > 40 ? 'down' : 'mut'}">${fmt(worstShare)}% منها لدى عامل واحد</span>`)}
        ${kpi('أفضل عامل', esc(best.wk), `<span class="mut">${pct(best.acc, 1)} في ${best.n} جرد</span>`)}
      </div>
      ${card('منصة التتويج', 'أفضل 3 عمال بالدقة المرجّحة', rank.slice(0, 3).map((r, i) => `<div class="rank"><span class="i" style="font-size:20px;background:none">${medal[i]}</span><span>${esc(r.wk)}<small>${r.n} جرد · ${fmt(r.items)} صنف · ${r.errs} خطأ</small></span><b dir="ltr">${pct(r.acc)}</b></div>`).join(''), 's5')}
      ${card('تطور الدقة أسبوعيًا', 'آخر 8 أسابيع لأفضل 5 عمال (الأسبوع يبدأ الاثنين)', linesSVG(weeks.map(k => k.slice(5)), wser, { unit: '%', threshold: monT, tLabel: `حد التنبيه ${fmt(monT)}%`, max: 100, w: 600 }), 's7')}
      ${card('ترتيب العمال', c.name, table(['الترتيب', 'العامل', 'عدد الجردات', 'إجمالي الأصناف', 'إجمالي الأخطاء', 'الدقة %'],
        rank.map((r, i) => [i + 1, esc(r.wk), r.n, fmt(r.items), r.errs, `<span class="pill ${r.acc >= monT ? 'st-good' : 'st-bad'}">${pct(r.acc)}</span>`]), { num: [0, 2, 3, 4] }), 's7')}
      ${card('الدقة حسب المخزن', c.name, hbars(byWh.map(([k, v]) => [k, v, v >= monT ? '#9177E8' : '#DD6A49']), { dec: 1, unit: '%' }), 's5')}
      ${card('تنبيهات', 'مستخرجة تلقائيًا من السجلات', al.length ? al.map(([k, t]) => `<div class="${k}">${t}</div>`).join('') : '<div class="ok">جميع العمال فوق الحد.</div>', 's12')}
      </div>`;
  },

  // ---------------- تسجيل جرد ----------------
  form(st, p, cur = null) {
    const items = +st.items || 0, errs = +st.errs || 0, ws = this.workers(cur && cur.kid);
    return `<div class="form">
      <div class="f"><label>التاريخ *</label><input type="date" data-k="${p}.date" value="${esc(st.date)}" max="${today()}"></div>
      ${sel(p + '.wh', st.wh, [...Data.wh.values()].filter(w => w.active || (cur && w.id === cur.wid)).map(w => [w.id, w.name]), { label: 'المخزن *', all: '— اختر —' })}
      ${sel(p + '.wk', st.wk, ws.map(e => [e.id, e.name]), { label: 'العامل *', all: '— اختر —' })}
      <div class="f"><label>عدد الأصناف المجرودة *</label><input type="number" min="0" step="1" inputmode="numeric" data-k="${p}.items" value="${esc(st.items)}"></div>
      <div class="f"><label>عدد الأخطاء *</label><input type="number" min="0" step="1" inputmode="numeric" data-k="${p}.errs" value="${esc(st.errs)}"></div>
      <div class="f"><label>الدقة</label><div class="infobox" style="margin:0;padding:9px 12px"><b id="${p.replace('.', '-')}-acc">${items > 0 ? pct(accOf(items, errs)) : '—'}</b></div></div>
      <div class="f full"><label>ملاحظات</label><textarea rows="2" data-k="${p}.notes">${esc(st.notes)}</textarea></div>
      ${ws.length ? '' : '<div class="f full"><div class="warnbox" style="margin:0">لا يوجد عمال مُفعَّل لهم «مؤشر الأداء»؛ يضيفهم المدير من البيانات الأساسية.</div></div>'}</div>`;
  },
  errs(st) {
    const e = [];
    if (!st.date) e.push('التاريخ مطلوب'); else if (st.date > today()) e.push('التاريخ لا يمكن أن يكون في المستقبل');
    if (!st.wh) e.push('المخزن مطلوب'); if (!st.wk) e.push('العامل مطلوب');
    const i = +st.items, er = st.errs === '' ? NaN : +st.errs;
    if (!(Number.isInteger(i) && i > 0)) e.push('يجب أن يكون عدد الأصناف رقمًا صحيحًا أكبر من صفر');
    if (!(Number.isInteger(er) && er >= 0)) e.push('اكتب عدد الأخطاء (صفر لو لا توجد أخطاء)');
    else if (er > i) e.push(`عدد الأخطاء (${er}) أكبر من عدد الأصناف (${i})`);
    return e;
  },
  add() {
    const st = this.st.add; if (!st.date) st.date = today(); LS.set('qw_pf_wh', st.wh);
    return `<div class="card"><h3>تسجيل جرد</h3><div class="sub">كل سجل لعامل واحد. بعد الحفظ يبقى التاريخ والمخزن وعدد الأصناف كما هي لتسجيل العامل التالي بسرعة.</div><div id="add-msg"></div>
      ${this.form(st, 'pf.add')}
      <div style="display:flex;gap:10px;margin-top:16px"><button class="btn" data-act="pf-save" style="min-width:220px">حفظ السجل</button><button class="btn ghost" data-act="pf-clear">تفريغ الحقول</button></div></div>`;
  },
  nextNo() { let mx = 0; for (const x of T.perf.rows) { const m = /^PERF-(\d+)$/.exec(x.record_no); if (m) mx = Math.max(mx, +m[1]); } return 'PERF-' + String(mx + 1).padStart(4, '0'); },
  async save(btn) {
    const st = this.st.add, box = $('#add-msg'), e = this.errs(st);
    if (e.length) { box.innerHTML = `<div class="err">${e.join('<br>')}</div>`; return; }
    btn.disabled = true;
    try {
      const items = +st.items, errs = +st.errs; let row = null;
      for (let i = 0; i < 4 && !row; i++) {
        try { row = await API.insert('perf_records', { record_no: this.nextNo(), date: st.date, warehouse_id: +st.wh, worker_id: +st.wk, items_count: items, errors: errs,
          accuracy: accOf(items, errs), notes: st.notes.trim() || null, created_by: Data.me.username, created_at: nowKw() }); }
        catch (er) { if (er.code !== '23505') throw er; await T.perf.sync(); }
      }
      if (!row) throw new ApiError(409, '23505', 'تعارض في رقم السجل، حاول مرة أخرى');
      T.perf.put(row); log('performance', 'تسجيل جرد', `${row.record_no} | ${fmt(row.accuracy, 2)}%`);
      toast(`✓ تم حفظ ${row.record_no} بدقة ${pct(row.accuracy)}، جاهز للعامل التالي`);
      Object.assign(st, { wk: '', errs: '', notes: '' }); App.render();
    } catch (er) { box.innerHTML = `<div class="err">${esc(arErr(er))}</div>`; btn.disabled = false; }
  },

  // ---------------- السجلات ----------------
  filtered(st) {
    let d = this.rows(); const [f, t] = presetRange(st, d.map(r => r.date));
    d = d.filter(r => r.date >= f && r.date <= t);
    if (st.wk) d = d.filter(r => String(r.kid) === String(st.wk));
    if (st.wh) d = d.filter(r => String(r.wid) === String(st.wh));
    return [d, f, t];
  },
  list() {
    const st = this.st.list, lv = Data.level('performance'), [d, f, t] = this.filtered(st), all = this.rows();
    const per = 100, pages = Math.max(1, Math.ceil(d.length / per)); st.page = Math.min(st.page, pages - 1);
    const view = d.slice(st.page * per, st.page * per + per), [dayT] = this.thr();
    return `<div class="filters">${periodControls('pf.list', st)}${sel('pf.list.wk', st.wk, [...new Map(all.map(r => [r.kid, r.wk])).entries()].sort(byName), { label: 'العامل', all: 'الكل' })}
        ${sel('pf.list.wh', st.wh, [...new Map(all.map(r => [r.wid, r.wh])).entries()], { label: 'المخزن', all: 'الكل' })}</div>
      <div class="period"><b>${fmt(d.length)} سجل — الدقة المرجّحة ${pct(this.wacc(d))} — ${fmt(d.reduce((s, r) => s + r.errs, 0))} خطأ</b><span class="mut">${spanText(f, t)}</span><button class="btn ghost sm" data-act="pf-export">⬇️ تنزيل Excel (CSV)</button></div>
      ${d.length ? `<div class="tbl"><table><thead><tr><th>رقم السجل</th><th>التاريخ</th><th>المخزن</th><th>العامل</th><th class="num">الأصناف المجرودة</th><th class="num">الأخطاء</th><th class="num">الدقة %</th><th>ملاحظات</th><th>سجّلها</th>${lv >= 3 ? '<th></th>' : ''}</tr></thead><tbody>
        ${view.map(r => `<tr><td>${esc(r.no)}</td><td>${r.date}</td><td>${esc(r.wh)}</td><td>${esc(r.wk)}</td><td class="num">${r.items}</td><td class="num">${r.errs}</td>
          <td class="num"><span class="${r.acc < dayT ? 'down' : ''}">${fmt(r.acc, 2)}</span></td><td>${esc(r.notes)}</td><td>${esc(r.by)}</td>
          ${lv >= 3 ? `<td style="white-space:nowrap"><button class="btn ghost sm" data-act="pf-edit" data-id="${r.id}">تعديل</button> <button class="btn ghost sm" data-act="pf-del" data-id="${r.id}">حذف</button></td>` : ''}</tr>`).join('')}
        </tbody></table></div>
        <div class="pager"><span>صفحة ${st.page + 1} من ${pages}</span><span><button class="btn ghost sm" data-act="pf-pg" data-d="-1" ${st.page ? '' : 'disabled'}>السابق</button>
        <button class="btn ghost sm" data-act="pf-pg" data-d="1" ${st.page < pages - 1 ? '' : 'disabled'}>التالي</button></span></div>` : '<div class="empty">لا توجد سجلات مطابقة</div>'}`;
  },
  openEdit(id) {
    const r = this.rows().find(x => x.id === id); if (!r) return;
    this.st.edit = { date: r.date, wh: String(r.wid), wk: String(r.kid), items: String(r.items), errs: String(r.errs), notes: r.notes }; this.editId = id;
    modal(`<h3>تعديل السجل ${esc(r.no)}</h3><div id="edit-msg"></div>${this.form(this.st.edit, 'pf.edit', r)}
      <div style="display:flex;gap:10px;margin-top:16px"><button class="btn" data-act="pf-save-edit">حفظ</button><button class="btn ghost" data-act="close">إلغاء</button></div>`);
  },
  async saveEdit(btn) {
    const st = this.st.edit, r = this.rows().find(x => x.id === this.editId), box = $('#edit-msg'), e = this.errs(st);
    if (e.length) { box.innerHTML = `<div class="err">${e.join('<br>')}</div>`; return; }
    btn.disabled = true;
    try {
      const items = +st.items, errs = +st.errs;
      const row = await API.update('perf_records', r.id, { date: st.date, warehouse_id: +st.wh, worker_id: +st.wk, items_count: items, errors: errs, accuracy: accOf(items, errs),
        notes: st.notes.trim() || null, updated_by: Data.me.username, updated_at: nowKw() });
      T.perf.put(row); log('performance', 'تعديل سجل جرد', r.no); closeModal(); toast('✓ تم حفظ التعديلات'); App.render();
    } catch (er) { box.innerHTML = `<div class="err">${esc(arErr(er))}</div>`; btn.disabled = false; }
  },
  confirmDel(id) {
    const r = this.rows().find(x => x.id === id); if (!r) return;
    modal(`<h3>تأكيد الحذف</h3><p>هل أنت متأكد من حذف السجل <b>${esc(r.no)}</b>؟<br>${esc(r.wk)} — ${r.date} — ${pct(r.acc)}</p><div id="del-msg"></div>
      <div style="display:flex;gap:10px"><button class="btn danger" data-act="pf-do-del" data-id="${id}">نعم، احذف</button><button class="btn ghost" data-act="close">إلغاء</button></div>`, 480);
  },
  async doDel(id, btn) {
    const r = this.rows().find(x => x.id === id); btn.disabled = true;
    try { await API.remove('perf_records', id); T.perf.drop(id); log('performance', 'حذف سجل جرد', r.no); closeModal(); toast('✓ تم حذف ' + r.no); App.render(); }
    catch (er) { $('#del-msg').innerHTML = `<div class="err">${esc(arErr(er))}</div>`; btn.disabled = false; }
  },

  // ---------------- التقارير ----------------
  rep() {
    const st = this.st.rep, all = this.rows(); const [f, t] = presetRange(st, all.map(r => r.date)), d = all.filter(r => r.date >= f && r.date <= t);
    const head = `<div class="filters">${periodControls('pf.rep', st)}</div><div class="period"><span class="box">📅 ${spanText(f, t)}</span></div>`;
    if (!d.length) return head + '<div class="warnbox">لا توجد بيانات في هذه الفترة</div>';
    const rank = this.ranking(d), [, monT] = this.thr(), months = [...new Set(d.map(r => r.ym))].sort();
    const ser = rank.slice(0, 5).map((w, i) => [w.wk, months.map(m => { const x = d.filter(r => r.wk === w.wk && r.ym === m); return x.length ? this.wacc(x) : null; }), LINE_COLORS[i]]);
    this._rep = { rank, f, t };
    return head + `<div class="grid g4" style="margin-bottom:14px">${kpi('الدقة المرجّحة', pct(this.wacc(d)))}${kpi('عدد الجردات', fmt(d.length))}${kpi('الأصناف المجرودة', fmt(d.reduce((s, r) => s + r.items, 0)))}${kpi('إجمالي الأخطاء', fmt(d.reduce((s, r) => s + r.errs, 0)))}</div>
      ${card('الترتيب في الفترة', `<button class="btn ghost sm" data-act="pf-export-rank">⬇️ تنزيل (CSV)</button>`, table(['الترتيب', 'العامل', 'عدد الجردات', 'إجمالي الأصناف', 'إجمالي الأخطاء', 'أعلى دقة', 'أقل دقة', 'الدقة %'],
        rank.map((r, i) => [i + 1, esc(r.wk), r.n, fmt(r.items), r.errs, fmt(r.hi, 2), fmt(r.lo, 2), `<span class="pill ${r.acc >= monT ? 'st-good' : 'st-bad'}">${pct(r.acc)}</span>`]), { num: [0, 2, 3, 4, 5, 6] }))}
      <div style="height:14px"></div>
      ${months.length >= 2 ? card('تطور الدقة شهريًا', 'أفضل 5 عمال في الفترة', linesSVG(months.map(mshort), ser, { unit: '%', dec: 2, threshold: monT, tLabel: `حد التنبيه ${fmt(monT)}%`, max: 100 })) : ''}`;
  },

  // ---------------- الإعدادات ----------------
  set() {
    const [d, m] = this.thr();
    return `<div class="card"><h3>حدود التنبيه</h3><div class="sub">الجرد اليومي تحت الحد اليومي يظهر في التنبيهات، والعامل تحت الحد الشهري يظهر باللون الأحمر.</div><div id="set-msg"></div>
      <div class="inrow"><div class="f"><label>حد التنبيه اليومي (%)</label><input id="s-day" type="number" min="0" max="100" value="${d}"></div>
      <div class="f"><label>حد التنبيه الشهري (%)</label><input id="s-mon" type="number" min="0" max="100" value="${m}"></div><button class="btn" data-act="pf-save-thr">حفظ</button></div>
      <div class="mut" style="font-size:12.5px;margin-top:12px">يُدار العمال (تفعيل «مؤشر الأداء» لكل عامل) والمخازن من «البيانات الأساسية» للمدير.</div></div>`;
  },
  act: {
    'save': (t) => Performance.save(t), 'save-edit': (t) => Performance.saveEdit(t),
    'clear': () => { Object.assign(Performance.st.add, { date: today(), wh: '', wk: '', items: '', errs: '', notes: '' }); App.render(); },
    'edit': (t) => Performance.openEdit(+t.dataset.id), 'del': (t) => Performance.confirmDel(+t.dataset.id), 'do-del': (t) => Performance.doDel(+t.dataset.id, t),
    'pg': (t) => { Performance.st.list.page += +t.dataset.d; App.render(); },
    'export': () => download(`counts_${today()}.csv`, [['رقم السجل', 'التاريخ', 'المخزن', 'العامل', 'الأصناف المجرودة', 'الأخطاء', 'الدقة %', 'ملاحظات', 'سجّلها'],
      ...Performance.filtered(Performance.st.list)[0].map(r => [r.no, r.date, r.wh, r.wk, r.items, r.errs, r.acc, r.notes, r.by])]),
    'export-rank': () => { const R = Performance._rep; if (R) download(`worker_ranking_${R.f}_${R.t}.csv`, [['الترتيب', 'العامل', 'عدد الجردات', 'إجمالي الأصناف', 'إجمالي الأخطاء', 'أعلى دقة', 'أقل دقة', 'الدقة %'],
      ...R.rank.map((r, i) => [i + 1, r.wk, r.n, r.items, r.errs, r.hi, r.lo, r.acc])]); },
    'save-thr': async () => {
      const d = +$('#s-day').value, m = +$('#s-mon').value, box = $('#set-msg');
      if (!(d >= 0 && d <= 100 && m >= 0 && m <= 100) || $('#s-day').value === '' || $('#s-mon').value === '') { box.innerHTML = '<div class="err">اكتب نسبًا بين 0 و100</div>'; return; }
      try { await API.upsert('settings', [{ key: 'perf_daily_threshold', value: String(d) }, { key: 'perf_monthly_threshold', value: String(m) }], 'key'); await T.settings.sync();
        log('performance', 'تعديل حدود التنبيه', `${d}/${m}`); toast('✓ تم الحفظ'); App.render(); }
      catch (er) { box.innerHTML = `<div class="err">${esc(arErr(er))}</div>`; }
    },
  },
};
// الدقة تتحدث فورًا أثناء الكتابة
document.addEventListener('input', e => {
  const k = e.target.dataset && e.target.dataset.k; if (!k || !/^pf\.(add|edit)\.(items|errs)$/.test(k)) return;
  const g = k.split('.')[1], st = Performance.st[g]; st[k.split('.')[2]] = e.target.value;
  const el = $(`#pf-${g}-acc`); if (el) el.textContent = +st.items > 0 ? pct(accOf(+st.items, +st.errs || 0)) : '—';
});
// ============================================================================
// قسم تقييم موظفي المخزن: سندات أحداث لكل موظف، والتقييم بمجموع نقاط الأحداث السلبية
// ============================================================================
const SEV = { critical: ['🔴 حرج (صعب)', '#DD6A49', 5], medium: ['🟠 متوسط', '#E8B04B', 3], minor: ['🟡 بسيط', '#4A8FDB', 1] };
const GRADE = { excellent: ['✅ ممتاز', '#22A285', 'st-good'], very_good: ['🟢 جيد جدًا', '#4A8FDB', 'st-good'], fair: ['🟡 مقبول', '#E8B04B', 'st-warn'], follow: ['🔴 يحتاج متابعة', '#DD6A49', 'st-bad'] };
const gradeOf = (p, th) => p <= 0 ? 'excellent' : p <= th * 0.4 ? 'very_good' : p < th ? 'fair' : 'follow';
const gpill = c => `<span class="pill ${GRADE[c][2]}">${GRADE[c][0]}</span>`;
const fp = v => fmt(v, Number.isInteger(v) ? 0 : 1);

const Employees = {
  key: 'employees', title: 'تقييم موظفي المخزن', icon: '👥', tables: ['emprec', 'evtypes', 'settings'],
  st: {
    tab: LS.get('qw_em_tab', 'dash'),
    dash: { kind: 'month', p: '' },
    add: { date: '', emp: '', ev: '', notes: '', action: '' },
    list: { preset: 'year', f: '', t: '', emp: '', ev: '', q: '', page: 0 },
    prof: { emp: '', preset: 'year', f: '', t: '' },
    edit: {},
  },
  quiet(grp, k) { return (grp === 'edit' && !['emp', 'ev'].includes(k)) || (grp === 'add' && ['notes', 'action', 'date'].includes(k)); },
  th() { return +setting('emp_followup_threshold', 5) || 5; },
  staff(keep) { return [...Data.emp.values()].filter(e => e.active || e.id === keep).sort(byName); },
  evs(keep) { return T.evtypes.rows.filter(e => e.active || e.id === keep).sort((a, b) => a.name.localeCompare(b.name, 'ar')); },
  rows() {
    const v = [T.emprec.v, T.evtypes.v, Data.lv].join('.');
    if (this._v === v) return this._rows;
    const E = new Map(T.evtypes.rows.map(e => [e.id, e]));
    this._rows = T.emprec.rows.map(r => { const e = Data.emp.get(r.employee_id) || {}, t = E.get(r.event_type_id) || {};
      const neg = +t.counts_negative === 1;
      return { id: r.id, no: r.record_no, date: r.date, ym: r.date.slice(0, 7), eid: r.employee_id, emp: e.name || '?', job: e.job_title || '', tid: r.event_type_id, ev: t.name || '?',
        neg, crit: +t.is_critical === 1, sev: t.severity || 'medium', pts: neg ? (+t.points || 0) : 0, notes: r.notes || '', action: r.action_taken || '', by: r.created_by || '' }; })
      .sort((a, b) => a.date < b.date ? 1 : a.date > b.date ? -1 : b.id - a.id);
    this._v = v; return this._rows;
  },
  // تقييم كل الموظفين النشطين، بمن فيهم من ليس لهم أي حدث
  evaluation(d) {
    const th = this.th(), m = new Map();
    for (const r of d) { const o = m.get(r.eid) || { pts: 0, neg: 0, all: 0 }; o.all++; if (r.neg) { o.neg++; o.pts += r.pts; } m.set(r.eid, o); }
    return [...Data.emp.values()].filter(e => e.active).map(e => { const o = m.get(e.id) || { pts: 0, neg: 0, all: 0 }; return { id: e.id, emp: e.name, job: e.job_title || '', ...o, code: gradeOf(o.pts, th) }; })
      .sort((a, b) => a.pts - b.pts || a.neg - b.neg || a.all - b.all || a.emp.localeCompare(b.emp, 'ar'));
  },
  render() {
    const lv = Data.level('employees');
    if (lv < 1) return `<div class="err">ليست لديك صلاحية على قسم تقييم موظفي المخزن. اطلبها من المدير.</div>`;
    const tabs = [['dash', 'لوحة المعلومات'], ...(lv >= 2 ? [['add', 'إضافة سند']] : []), ['list', 'السندات'], ['prof', 'ملف موظف'], ...(lv >= 3 ? [['set', 'الإعدادات']] : [])];
    if (!tabs.some(t => t[0] === this.st.tab)) this.st.tab = 'dash';
    return tabsBar(tabs, this.st.tab, 'em') + this[this.st.tab]();
  },

  // ---------------- لوحة المعلومات ----------------
  dash() {
    const st = this.st.dash, th = this.th(), all = this.rows(), c = cmpPeriod(st, all.map(r => r.date)), { f, t } = c, ly = all.filter(r => r.date >= c.pf && r.date <= c.pt);
    const d = all.filter(r => r.date >= f && r.date <= t), ev = this.evaluation(d), n = ev.length;
    const exc = ev.filter(e => e.pts <= 0).length, follow = ev.filter(e => e.pts >= th).sort((a, b) => b.pts - a.pts);
    const neg = d.filter(r => r.neg), crit = d.filter(r => r.crit);
    const head = `<div class="filters">${periodPicker('em.dash', st, c)}</div>${cmpHead(c)}`, lyNeg = ly.filter(r => r.neg).length, lyCrit = ly.filter(r => r.crit).length;
    const byType = new Map(); for (const r of d) { const o = byType.get(r.ev) || { n: 0, c: r.neg ? SEV[r.sev] ? SEV[r.sev][1] : '#4A8FDB' : '#5C7480' }; o.n++; byType.set(r.ev, o); }
    const types = [...byType.entries()].sort((a, b) => b[1].n - a[1].n);
    const gc = ev.reduce((m, e) => (m[e.code] = (m[e.code] || 0) + 1, m), {});
    const months = lastMonths(12, t.slice(0, 7));
    const worst = ev.filter(e => e.pts > 0).sort((a, b) => b.pts - a.pts).slice(0, 8);
    const near = ev.filter(e => e.pts > 0 && e.pts >= th * 0.7 && e.pts < th);
    const al = follow.slice(0, 4).map(e => ['err', `<b>${esc(e.emp)}</b> (${esc(e.job || '—')}): ${fp(e.pts)} نقطة من ${e.neg} أحداث سلبية. يُقترح لقاء متابعة وتوثيق الإجراء.`]);
    if (near.length) al.push(['warnbox', `${near.length} موظفين قريبون من حد المتابعة (${th} نقطة): ${near.slice(0, 4).map(e => esc(e.emp)).join('، ')}.`]);
    const acts = sortDesc(groupSum(d.filter(r => r.action.trim()), r => r.action.trim(), () => 1)).slice(0, 6);
    return head + `<div class="grid g12">
      <div class="card hero s12"><h2>انضباط فريق المخزن في ${c.name}: <bdi>${n ? fmt(exc / n * 100) : 0}%</bdi> بتقييم ممتاز</h2>
        <p>${exc} من ${n} موظفًا دون أي حدث سلبي في الفترة. ${follow.length} موظفين بلغوا حد المتابعة، والإجازات المرضية والاستئذان لا تُحتسب ضد أحد.</p>
        <div class="chips"><span class="chip">${d.length} حدث مسجل</span><span class="chip">${neg.length} سلبي</span>${crit.length ? `<span class="chip">${crit.length} حدث حرج</span>` : ''}</div></div>
      <div class="s12 grid g4">
        ${kpi('أحداث سلبية', fmt(neg.length), ly.length ? vsLY(neg.length, lyNeg, { higherGood: false }) : `<span class="mut">${fmt(d.length ? neg.length / d.length * 100 : 0)}% من الأحداث</span>`)}
        ${kpi('موظفون ممتازون', fmt(exc), `<span class="mut">من ${n} موظفًا، دون أي حدث سلبي</span>`, 'st-good')}
        ${kpi('يحتاجون متابعة', fmt(follow.length), `<span class="mut">${th} نقطة سلبية أو أكثر</span>`, follow.length ? 'st-bad' : 'st-good')}
        ${kpi('أحداث حرجة', fmt(crit.length), ly.length ? `<span class="mut">العام الماضي ${lyCrit}</span>` : '<span class="mut">سلوك غير لائق</span>', crit.length ? 'st-bad' : '')}
      </div>
      ${card('النقاط السلبية لكل موظف', 'كل حدث بدرجته، واللون حسب التقييم', worst.length ? hbars(worst.map(e => [e.emp, e.pts, GRADE[e.code][1]]), { dec: worst.every(e => Number.isInteger(e.pts)) ? 0 : 1 }) : '<div class="ok">لا توجد أحداث سلبية في الفترة.</div>', 's7')}
      ${card('توزيع التقييم', 'جميع الموظفين النشطين', donutSVG(Object.keys(GRADE).filter(k => gc[k]).map(k => [GRADE[k][0].split(' ').slice(1).join(' '), gc[k], GRADE[k][1]]), String(n), 'موظف'), 's5')}
      ${card('الأحداث حسب النوع', 'الأحمر حرج، والبرتقالي متوسط، والأزرق بسيط، والرمادي يُسجَّل فقط', hbars(types.map(([k, o]) => [k, o.n, o.c])), 's7')}
      ${card('يحتاجون متابعة', 'مرتبون حسب مجموع النقاط', al.length ? al.map(([k, x]) => `<div class="${k}">${x}</div>`).join('') : `<div class="ok">لم يبلغ أحد ${th} نقطة سلبية.</div>`, 's5')}
      ${months.length ? card('الأحداث شهريًا', 'آخر 12 شهرًا حتى نهاية الفترة: سلبية مقابل عادية', stackSVG(months.map(mshort), [['سلبية', months.map(m => all.filter(r => r.ym === m && r.neg).length), '#4A8FDB'], ['عادية', months.map(m => all.filter(r => r.ym === m && !r.neg).length), '#5C7480']], { unit: 'حدث', w: 640 }), 's7') : ''}
      ${acts.length ? card('الإجراءات المتخذة', 'على الأحداث المسجلة', ranks(acts), 's5') : ''}
      ${crit.length ? card('أحداث حرجة (سلوك)', 'مع الإجراء المتخذ', table(['التاريخ', 'الموظف', 'الحدث', 'الإجراء المتخذ', 'سجّلها'], crit.slice(0, 6).map(r => [r.date, esc(r.emp), esc(r.ev), esc(r.action || '—'), esc(r.by)])), 's12') : ''}
      ${card('تقييم الموظفين', `أعلى 12 موظفًا نقاطًا · <button class="btn ghost sm" data-act="em-export-eval">⬇️ تقييم جميع الموظفين (CSV)</button>`,
        table(['الموظف', 'المسمى الوظيفي', 'نقاط سلبية', 'أحداث سلبية', 'كل الأحداث', 'التقييم'],
          [...ev].sort((a, b) => b.pts - a.pts || b.neg - a.neg || b.all - a.all).slice(0, 12).map(e => [esc(e.emp), esc(e.job || '—'), fp(e.pts), e.neg, e.all, gpill(e.code)]), { num: [2, 3, 4] }), 's12')}
      </div>`;
  },

  // ---------------- إضافة سند ----------------
  form(st, p, cur = null) {
    const emp = Data.emp.get(+st.emp), ev = T.evtypes.rows.find(e => e.id === +st.ev);
    const evInfo = ev ? (+ev.counts_negative ? `النوع: ${(SEV[ev.severity] || SEV.medium)[0]} — الدرجة: ${fp(+ev.points || 0)} نقطة` : 'حدث يُسجَّل فقط ولا يُحتسب على الموظف') : '';
    return `<div class="form">
      <div class="f"><label>التاريخ *</label><input type="date" data-k="${p}.date" value="${esc(st.date)}" max="${today()}"></div><div></div>
      <div class="f">${sel(p + '.emp', st.emp, this.staff(cur && cur.eid).map(e => [e.id, e.name]), { label: 'الموظف *', all: '— اختر —' }).replace(/^<div class="f ">|<\/div>$/g, '')}
        ${emp ? `<small class="mut">المسمى الوظيفي: ${esc(emp.job_title || '—')}</small>` : ''}</div>
      <div class="f">${sel(p + '.ev', st.ev, this.evs(cur && cur.tid).map(e => [e.id, e.name]), { label: 'الحدث *', all: '— اختر —' }).replace(/^<div class="f ">|<\/div>$/g, '')}
        ${evInfo ? `<small class="mut">${evInfo}</small>` : ''}</div>
      <div class="f full"><label>ملاحظات</label><textarea rows="2" data-k="${p}.notes">${esc(st.notes)}</textarea></div>
      <div class="f full"><label>الإجراء المتخذ</label><textarea rows="2" data-k="${p}.action" placeholder="مثال: إنذار شفهي، خصم يوم...">${esc(st.action)}</textarea></div></div>`;
  },
  errs(st) {
    const e = [];
    if (!st.date) e.push('التاريخ مطلوب'); else if (st.date > today()) e.push('التاريخ لا يمكن أن يكون في المستقبل');
    if (!st.emp) e.push('الموظف مطلوب'); if (!st.ev) e.push('الحدث مطلوب');
    return e;
  },
  add() {
    const st = this.st.add; if (!st.date) st.date = today();
    return `<div class="card"><h3>إضافة سند</h3><div id="add-msg"></div>${this.form(st, 'em.add')}
      <div style="margin-top:16px"><button class="btn" data-act="em-save" style="min-width:220px">حفظ السند</button></div></div>`;
  },
  nextNo() { let mx = 0; for (const x of T.emprec.rows) { const m = /^EMP-(\d+)$/.exec(x.record_no); if (m) mx = Math.max(mx, +m[1]); } return 'EMP-' + String(mx + 1).padStart(4, '0'); },
  async save(btn) {
    const st = this.st.add, box = $('#add-msg'), e = this.errs(st);
    if (e.length) { box.innerHTML = `<div class="err">${e.join('<br>')}</div>`; return; }
    btn.disabled = true;
    try {
      let row = null;
      for (let i = 0; i < 4 && !row; i++) {
        try { row = await API.insert('emp_records', { record_no: this.nextNo(), date: st.date, employee_id: +st.emp, event_type_id: +st.ev, notes: st.notes.trim() || null,
          action_taken: st.action.trim() || null, created_by: Data.me.username, created_at: nowKw() }); }
        catch (er) { if (er.code !== '23505') throw er; await T.emprec.sync(); }
      }
      if (!row) throw new ApiError(409, '23505', 'تعارض في رقم السند، حاول مرة أخرى');
      T.emprec.put(row); log('employees', 'إضافة سند', row.record_no);
      toast(`✓ تم حفظ السند ${row.record_no}`); Object.assign(st, { emp: '', ev: '', notes: '', action: '' }); App.render();
    } catch (er) { box.innerHTML = `<div class="err">${esc(arErr(er))}</div>`; btn.disabled = false; }
  },

  // ---------------- السندات ----------------
  filtered(st) {
    let d = this.rows(); const [f, t] = presetRange(st, d.map(r => r.date));
    d = d.filter(r => r.date >= f && r.date <= t);
    if (st.emp) d = d.filter(r => String(r.eid) === String(st.emp));
    if (st.ev) d = d.filter(r => String(r.tid) === String(st.ev));
    if (st.q) { const q = st.q.trim().toLowerCase(); d = d.filter(r => [r.no, r.emp, r.ev, r.notes, r.action, r.by].some(v => String(v).toLowerCase().includes(q))); }
    return [d, f, t];
  },
  recTable(view, lv) {
    return `<div class="tbl"><table><thead><tr><th>رقم السند</th><th>التاريخ</th><th>الموظف</th><th>المسمى الوظيفي</th><th>الحدث</th><th class="num">النقاط</th><th>ملاحظات</th><th>الإجراء المتخذ</th><th>سجّلها</th>${lv >= 3 ? '<th></th>' : ''}</tr></thead><tbody>
      ${view.map(r => `<tr><td>${esc(r.no)}</td><td>${r.date}</td><td>${esc(r.emp)}</td><td>${esc(r.job)}</td><td>${r.crit ? '🔴 ' : ''}${esc(r.ev)}</td><td class="num">${r.neg ? fp(r.pts) : '<span class="mut">—</span>'}</td>
        <td>${esc(r.notes)}</td><td>${esc(r.action)}</td><td>${esc(r.by)}</td>
        ${lv >= 3 ? `<td style="white-space:nowrap"><button class="btn ghost sm" data-act="em-edit" data-id="${r.id}">تعديل</button> <button class="btn ghost sm" data-act="em-del" data-id="${r.id}">حذف</button></td>` : ''}</tr>`).join('')}
      </tbody></table></div>`;
  },
  list() {
    const st = this.st.list, lv = Data.level('employees'), [d, f, t] = this.filtered(st), all = this.rows();
    const per = 100, pages = Math.max(1, Math.ceil(d.length / per)); st.page = Math.min(st.page, pages - 1);
    return `<div class="filters">${periodControls('em.list', st)}${sel('em.list.emp', st.emp, [...new Map(all.map(r => [r.eid, r.emp])).entries()].sort(byName), { label: 'الموظف', all: 'الكل' })}
        ${sel('em.list.ev', st.ev, [...new Map(all.map(r => [r.tid, r.ev])).entries()].sort(byName), { label: 'الحدث', all: 'الكل' })}
        <div class="f" style="flex:1"><label>بحث</label><input data-k="em.list.q" data-live="1" value="${esc(st.q)}" placeholder="رقم السند، ملاحظة، إجراء..."></div></div>
      <div class="period"><b>${fmt(d.length)} سند — ${fp(d.reduce((s, r) => s + r.pts, 0))} نقطة سلبية</b><span class="mut">${spanText(f, t)}</span><button class="btn ghost sm" data-act="em-export">⬇️ تنزيل Excel (CSV)</button></div>
      ${d.length ? this.recTable(d.slice(st.page * per, st.page * per + per), lv) + `<div class="pager"><span>صفحة ${st.page + 1} من ${pages}</span><span><button class="btn ghost sm" data-act="em-pg" data-d="-1" ${st.page ? '' : 'disabled'}>السابق</button>
        <button class="btn ghost sm" data-act="em-pg" data-d="1" ${st.page < pages - 1 ? '' : 'disabled'}>التالي</button></span></div>` : '<div class="empty">لا توجد سندات مطابقة</div>'}`;
  },
  openEdit(id) {
    const r = this.rows().find(x => x.id === id); if (!r) return;
    this.st.edit = { date: r.date, emp: String(r.eid), ev: String(r.tid), notes: r.notes, action: r.action }; this.editId = id;
    modal(`<h3>تعديل السند ${esc(r.no)}</h3><div id="edit-msg"></div><div id="edit-form">${this.form(this.st.edit, 'em.edit', r)}</div>
      <div style="display:flex;gap:10px;margin-top:16px"><button class="btn" data-act="em-save-edit">حفظ</button><button class="btn ghost" data-act="close">إلغاء</button></div>`);
  },
  refreshEdit() { const r = this.rows().find(x => x.id === this.editId); $('#edit-form').innerHTML = this.form(this.st.edit, 'em.edit', r); },
  async saveEdit(btn) {
    const st = this.st.edit, r = this.rows().find(x => x.id === this.editId), box = $('#edit-msg'), e = this.errs(st);
    if (e.length) { box.innerHTML = `<div class="err">${e.join('<br>')}</div>`; return; }
    btn.disabled = true;
    try {
      const row = await API.update('emp_records', r.id, { date: st.date, employee_id: +st.emp, event_type_id: +st.ev, notes: (st.notes || '').trim() || null,
        action_taken: (st.action || '').trim() || null, updated_by: Data.me.username, updated_at: nowKw() });
      T.emprec.put(row); log('employees', 'تعديل سند', r.no); closeModal(); toast('✓ تم حفظ التعديلات'); App.render();
    } catch (er) { box.innerHTML = `<div class="err">${esc(arErr(er))}</div>`; btn.disabled = false; }
  },
  confirmDel(id) {
    const r = this.rows().find(x => x.id === id); if (!r) return;
    modal(`<h3>تأكيد الحذف</h3><p>هل أنت متأكد من حذف السند <b>${esc(r.no)}</b>؟<br>${esc(r.emp)} — ${esc(r.ev)} — ${r.date}</p><div id="del-msg"></div>
      <div style="display:flex;gap:10px"><button class="btn danger" data-act="em-do-del" data-id="${id}">نعم، احذف</button><button class="btn ghost" data-act="close">إلغاء</button></div>`, 480);
  },
  async doDel(id, btn) {
    const r = this.rows().find(x => x.id === id); btn.disabled = true;
    try { await API.remove('emp_records', id); T.emprec.drop(id); log('employees', 'حذف سند', r.no); closeModal(); toast('✓ تم حذف ' + r.no); App.render(); }
    catch (er) { $('#del-msg').innerHTML = `<div class="err">${esc(arErr(er))}</div>`; btn.disabled = false; }
  },

  // ---------------- ملف موظف ----------------
  prof() {
    const st = this.st.prof, all = [...Data.emp.values()].sort(byName);
    const head = `<div class="filters">${sel('em.prof.emp', st.emp, all.map(e => [e.id, e.name + (e.active ? '' : ' (موقوف)')]), { label: 'اختر الموظف', all: '— اختر —' })}${periodControls('em.prof', st)}</div>`;
    if (!st.emp) return head + '<div class="infobox">اختر موظفًا لعرض ملفه.</div>';
    const e = Data.emp.get(+st.emp), [f, t] = presetRange(st, this.rows().map(r => r.date));
    const d = this.rows().filter(r => r.eid === +st.emp && r.date >= f && r.date <= t), pts = d.reduce((s, r) => s + r.pts, 0), code = gradeOf(pts, this.th());
    return head + `<div class="period"><span class="box">📅 ${spanText(f, t)}</span></div>
      <div class="grid g4" style="margin-bottom:14px">${kpi('الموظف', esc(e.name), `<span class="mut">${esc(e.job_title || '')}</span>`)}${kpi('كل الأحداث', fmt(d.length), '<span class="mut">في الفترة</span>')}
        ${kpi('الأحداث السلبية', fmt(d.filter(r => r.neg).length), `<span class="mut">${fp(pts)} نقطة</span>`)}${kpi('التقييم', gpill(code), '<span class="mut">حسب مجموع النقاط</span>')}</div>
      ${d.length ? this.recTable(d, Data.level('employees')) : '<div class="ok">لا توجد أحداث لهذا الموظف في الفترة.</div>'}`;
  },

  // ---------------- الإعدادات ----------------
  set() {
    const evs = [...T.evtypes.rows].sort((a, b) => a.id - b.id), sevOpts = cur => Object.entries(SEV).map(([k, v]) => opt(k, v[0], cur)).join('');

// ---------------- مركز القيادة ----------------
const STEP = { month: 1, quarter: 3, half: 6, year: 12 }, BACK = { month: 36, quarter: 12, half: 6, year: 5 };
const KINDS = [['month', 'الشهر الحالي'], ['quarter', 'الربع الحالي'], ['half', 'نصف السنة الحالي'], ['year', 'السنة الحالية']];
const REFS = [['yoy', 'نفس الفترة من العام الماضي'], ['prev', 'الفترة السابقة مباشرة'], ['peak', 'أعلى فترة سابقة']];
const addMonths = (d, n) => { const y = +d.slice(0, 4), m = +d.slice(5, 7) - 1 + n, yy = y + Math.floor(m / 12), mm = ((m % 12) + 12) % 12; return `${yy}-${String(mm + 1).padStart(2, '0')}-01`; };
const clamp = v => v === null || v === undefined || isNaN(v) ? null : Math.max(0, Math.min(100, v));
function cmdWindows(kind, ref, t) {
  const y = t.slice(0, 4), m = +t.slice(5, 7);
  const p0 = kind === 'month' ? t.slice(0, 8) + '01' : kind === 'quarter' ? `${y}-${String(Math.floor((m - 1) / 3) * 3 + 1).padStart(2, '0')}-01` : kind === 'half' ? `${y}-${m <= 6 ? '01' : '07'}-01` : `${y}-01-01`;
  const days = daysBetween(p0, t), same = a0 => { const end = addDays(addMonths(a0, STEP[kind]), -1), e = addDays(a0, days); return [a0, e < end ? e : end]; };
  const c = ref === 'yoy' ? [same(addMonths(p0, -12))] : ref === 'prev' ? [same(addMonths(p0, -STEP[kind]))] : Array.from({ length: BACK[kind] }, (_, i) => same(addMonths(p0, -STEP[kind] * (i + 1))));
  return [[p0, t], c];
}
const inW = (rows, w) => rows.filter(r => r.date >= w[0] && r.date <= w[1]);
const statusOf = sc => sc === null ? ['لا توجد بيانات', 'neutral', '#8FA6A4'] : sc >= 85 ? ['ممتاز', 'good', '#22A285'] : sc >= 70 ? ['جيد', 'warn', '#E8B04B'] : ['يحتاج متابعة', 'bad', '#DD6A49'];

const Command = {
  key: 'command', title: 'مركز القيادة', icon: '🛰️', always: true, st: { tab: 'main', main: { fac: '', kind: 'month', ref: 'yoy' } },
  get tables() { return secTables(); },
  // مقياس تراكمي: الحالي مقابل المرجع بنفس عدد الأيام
  flow(rows, val, cur, cands, higher, ref) {
    const v = inW(rows, cur).reduce((s, r) => s + val(r), 0), opts = [];
    for (const w of cands) { const x = inW(rows, w); if (x.length) opts.push([w, x.reduce((s, r) => s + val(r), 0)]); }
    if (!opts.length) return { cur: v, ref: null, refw: null, chg: null, score: null, good: null };
    const [w, r] = ref === 'peak' ? opts.reduce((a, b) => b[1] > a[1] ? b : a) : opts[0];
    const chg = r ? (v / r - 1) * 100 : null;
    const score = !r ? null : higher ? clamp(v / r * 100) : v <= r ? 100 : clamp(100 - (v / r - 1) * 100);
    return { cur: v, ref: r, refw: w, chg, score, good: chg === null || Math.abs(chg) < 0.05 ? null : (chg > 0) === higher };
  },
  dieselEff(w) {

  async build(onStep) {

      const keys = rows.length ? Object.keys(rows[0]) : (cols === '*' ? ['id'] : cols.split(','));

    }
    const stamp = nowKw().replace(/[: ]/g, '-').slice(0, 16);
    const info = ['معلومات النسخة', [['البيان', 'القيمة'], ['البرنامج', 'إدارة المخازن — مصنع القطامي'], ['وقت النسخة', nowKw()], ['بواسطة', Data.me.username], ['الإصدار', VERSION],

    onStep && onStep('Excel');
    for (const t of Object.values(T)) if (t.ready) { try { await t.sync(); } catch (e) {} }
    const x = await ExcelApp.build(onStep, [info, ...sheets]);
    return { blob: x.blob, name: `qattami-backup-${stamp}.xlsx`, counts };
  },
  async dir() { return await Cache.get('keep:bk_dir'); },
  // حفظ نسخة: في المجلد المختار لو متاح، وإلا تنزيل عادي
  async save(onStep, interactive = true) {
    // نحدد مكان الحفظ أولًا (قبل تجهيز الملف)، حتى لا نحمّل كل البيانات بلا فائدة
    let h = await this.dir(), perm = null;
    if (h && h.queryPermission) { perm = await h.queryPermission({ mode: 'readwrite' }); if (perm !== 'granted' && interactive) perm = await h.requestPermission({ mode: 'readwrite' }); }
    if (!interactive && perm !== 'granted') return null;
    const { blob, name, counts } = await this.build(onStep);
    let where = 'download';
    if (h && perm === 'granted') { const f = await h.getFileHandle(name, { create: true }), w = await f.createWritable(); await w.write(blob); await w.close(); where = h.name;
      try { const pk = await Pack.build(); const f2 = await h.getFileHandle(pk.name, { create: true }), w2 = await f2.createWritable(); await w2.write(pk.blob); await w2.close(); } catch (e) {} }

      : mins < 1440 ? (en ? `${h} h ago` : `منذ ${h} ساعة`) : (en ? `${dd} days ago` : `منذ ${dd} يوم`);

  toLogin(msg = '') {
    clearInterval(this._t);
    $('#root').innerHTML = `<div class="login"><div>${STACK_ART()}<div class="card"><div class="brand" style="border:0;padding:0 0 12px"><div class="logo">${LOGO(46)}</div><div><b>إدارة المخازن</b><small>مصنع القطامي</small></div></div>
      ${msg ? `<div class="err">${esc(msg)}</div>` : ''}
      <form id="lf" onsubmit="return false"><div class="f"><label>الإيميل أو اسم الدخول</label><input id="l-u" dir="ltr" autocomplete="username" value="${esc(LS.get('qw_last_user', ''))}"></div>
      <div class="f"><label>كلمة المرور</label><input id="l-p" type="password" dir="ltr" autocomplete="current-password"></div>
      <button class="btn" id="l-go" style="width:100%">دخول</button></form>
      <p class="mut" style="margin-top:14px;font-size:12.5px">الإيميل المسجّل في Supabase، أو اسم الدخول المستخدم في البرنامج. <a href="#" id="l-setup">إعدادات الاتصال</a></p><div style="text-align:center;margin-top:10px">${Lang.btn()}</div></div></div></div>`;
    const go = async () => {
      const u = $('#l-u').value.trim(), p = $('#l-p').value; const b = $('#l-go');
      if (!u || !p) return;
      b.disabled = true; b.innerHTML = '<span class="spin"></span>';
      try { await API.login(u, p); LS.set('qw_last_user', u); LS.del('qw_offline_user'); OfflineAuth._pw = p; await this.boot(); }
      catch (e) {
        if (e.code !== 'network') return this.toLogin(arErr(e));
        // لا يوجد إنترنت: ندخل من القفل المحفوظ على الجهاز أو من ملف الطوارئ
        const me = await OfflineAuth.login(u, p);
        if (me === 'bad') return this.toLogin(ERR_AR.invalid_credentials);
        if (!me) return this.toLogin('لا يوجد اتصال بالإنترنت. للدخول بدون إنترنت افتح «ملف الطوارئ»، أو ادخل من جهاز سبق أن دخلت منه بالإنترنت.');
        LS.set('qw_me', JSON.stringify(me)); LS.set('qw_offline_user', me.username); LS.set('qw_last_user', u); Outbox.online = false;
        await this.boot();
      }
    };
    $('#l-go').onclick = go; $('#l-setup').onclick = e => { e.preventDefault(); this.setup(); };
    ($('#l-u').value ? $('#l-p') : $('#l-u')).focus();
  },
  loading(text = 'جارٍ تحميل البيانات...') {
    return `<div class="loading"><span class="spin" style="width:34px;height:34px;border-width:3px"></span><div>${text}</div><div class="bar-prog"><i id="ld-p"></i></div></div>`;
  },
  // إشارة «أنا متصل» كل دقيقة طالما البرنامج مفتوح؛ والمدير يرى الحالة في صفحة المستخدمين
  beat(on = true) {
    if (!API.session) return Promise.resolve();
    return API.rpc('app_heartbeat', { p_online: on }).catch(() => {}).then(() => { if (on && typeof Admin !== 'undefined') Admin.refreshPresence(); });
  },
  async boot() {
    $('#root').innerHTML = this.loading();
    try {
      try { Data.me = await API.rpc('app_me'); if (Data.me) LS.set('qw_me', JSON.stringify(Data.me)); }
      catch (er) {   // بدون إنترنت: نفتح بآخر بيانات محفوظة على الجهاز
        let c = null; try { c = JSON.parse(LS.get('qw_me') || 'null'); } catch (x) {}
        if (er.code !== 'network' || !c) throw er; Data.me = c; Outbox.online = false;
      }
      // دخلت بالإنترنت من ملف طوارئ أحدث: نحمّل منه الشغل اللي لسه متبعتش علشان يتبعت دلوقتي
      if (API.session && Pack.el() && await Pack.newer()) { try { const k = await API.rpc('app_data_key'); if (k) await Pack.seed(k); } catch (x) {} }
      await Outbox.init();
      if (OfflineAuth._pw && API.session) OfflineAuth.enroll();
      if (!Data.me) { await API.logout(); return this.toLogin('هذا الحساب غير مرتبط بمستخدم مفعّل في البرنامج.'); }
      await Data.lookups();
      if (!PAGES[this.page]) this.page = 'home';
      if (this.page === 'admin' && !Data.me.is_admin) this.page = 'home';
      this.shell(); Outbox.paint(); await this.open(this.page); Outbox.flush();
      if (Data.me.is_admin) Backup.auto();
      clearInterval(this._t); this._t = setInterval(() => this.sync(true), 120000);
      this.beat(); clearInterval(this._hb); this._hb = setInterval(() => this.beat(), 60000);
    } catch (e) {
      if (!API.session) return this.toLogin(arErr(e));
      $('#root').innerHTML = `<div class="login"><div class="card"><h1>تعذّر التحميل</h1><div class="err">${esc(arErr(e))}</div><button class="btn" onclick="location.reload()">إعادة المحاولة</button></div></div>`;
    }
  },
  // فتح قسم: نحمّل جداوله أول مرة (من الذاكرة لو موجودة) ثم نعرضه، ثم نزامن في الخلفية
  async open(key) {
    this.page = key; LS.set('qw_page', key);
    const P = PAGES[key]; this.navMark();
    $('#title').textContent = P.icon + ' ' + P.title;
    if (!P.always && Data.level(key) < 1) return this.render();
    const need = P.tables.map(n => T[n]).filter(t => !t.ready);
    if (need.length) {
      $('#page').innerHTML = this.loading();
      let done = 0; const prog = () => { const el = $('#ld-p'); if (el) el.style.width = (done / need.length * 100).toFixed(0) + '%'; };
      const how = await Promise.all(need.map(t => t.load().catch(e => { if (e.code !== 'network') throw e; t.rows = []; t.ready = true; t.v++; return 'cache'; }).then(h => { done++; prog(); return h; })));   // جدول مش موجود على الجهاز ومفيش نت: يفتح فاضي بدل ما يعلّق
      this.render();
      if (how.includes('cache')) this.sync(true);
    } else this.render();
  },
  async sync(quiet = false) {
    if (this.busy) return;
    if (!API.session) { Outbox.paint(); if (!quiet) toast(navigator.onLine ? 'سجّل الدخول بالإنترنت لتحديث البيانات وإرسال ما سجّلته' : 'لا يوجد اتصال بالإنترنت؛ ما سجّلته محفوظ على الجهاز وسيُرسل تلقائيًا', true); return; }
    if (Outbox.pending()) { await Outbox.flush(); if (Outbox.pending()) { Outbox.paint(); if (!quiet) toast('لا يوجد اتصال بالإنترنت؛ ما سجّلته محفوظ على الجهاز وسيُرسل تلقائيًا', true); return; } }
    const el = $('#sync-t'); if (el) el.innerHTML = '<span class="spin"></span> جارٍ التحديث...';
    try {
      const before = Data.lv; const P = PAGES[this.page];
      const chs = await Promise.all(Object.values(T).filter(t => t.ready).map(t => t.sync()));
      if (!quiet) await Data.lookups();
      if (chs.some(Boolean) || Data.lv !== before) { if (!$('#modal')) this.render(); }
      this.syncedAt = Date.now(); Outbox.online = true; Outbox.paint(); if (!quiet) toast('✓ البيانات محدّثة');
    } catch (e) { if (e.code === 'network') { Outbox.online = false; Outbox.paint(); } if (!quiet) toast(arErr(e), true); }
    this.syncLabel();
  },
  syncLabel() { const el = $('#sync-t'); if (el) el.textContent = this.syncedAt ? 'آخر تحديث ' + new Date(this.syncedAt).toLocaleTimeString((Lang.en() ? 'en-GB' : 'ar-EG'), { hour: '2-digit', minute: '2-digit' }) : ''; },
  shell() {
    const me = Data.me;
    $('#root').innerHTML = `<div class="app"><aside class="side" id="side">
      <div class="brand"><div class="logo">${LOGO()}</div><div><b>إدارة المخازن</b><small>${esc(me.full_name || me.username)}${me.is_admin ? ' — مدير' : ''}</small></div></div>
      <div id="nav">${SECTIONS.filter(([k]) => k !== 'admin' || me.is_admin).map(([k, i, l]) => PAGES[k] ? `<button class="nav" data-nav="${k}">${i} ${l}</button>`
        : `<a class="nav soon" href="${OLD_APP}" target="_blank" rel="noopener" title="لم يُنقل بعد — يفتح في البرنامج القديم">${i} ${l}<span class="tag">↗</span></a>`).join('')}</div>
      <div class="foot"><button class="btn sm" id="install-btn" ${_installEvt ? '' : 'hidden'}>📥 تثبيت البرنامج على الجهاز</button><button class="btn sm" data-act="pk-local" title="ملف فيه البرنامج وكل البيانات وآخر شغل، تنقله بفلاشة لأي جهاز">💾 حفظ آخر شغل في ملف (للفلاشة)</button>${Lang.btn()}<button class="btn ghost sm" data-act="theme">🌓 تبديل المظهر</button><button class="btn ghost sm" data-act="logout">تسجيل الخروج</button>
      ${SECTIONS.some(([k]) => !PAGES[k]) ? '<span>الأقسام المعلّمة بـ ↗ تفتح في البرنامج القديم لحين نقلها.</span>' : ''}<span>الإصدار ${VERSION}</span></div></aside>
      <main class="main"><div class="top"><button class="btn ghost sm menu-btn" data-act="menu">☰</button><h1 id="title"></h1>
      <span class="sync"><span id="net"></span><span id="sync-t"></span><button class="btn ghost sm" data-act="sync">⟳ تحديث</button></span></div><div id="page"></div></main></div>`;
    this.syncedAt = Date.now(); this.syncLabel();
  },
  navMark() { $$('[data-nav]').forEach(b => b.classList.toggle('on', b.dataset.nav === this.page)); },
  render() {
    const p = $('#page'); if (!p) return;
    const y = window.scrollY; p.innerHTML = PAGES[this.page].render(); window.scrollTo(0, y);
    if (this.page === 'admin' && Admin.st.tab === 'backup') Admin.dirInfo();
  },
};

// ---------------- الأحداث (تفويض واحد لكل الصفحة) ----------------
// مفاتيح الحقول بالشكل: بادئة_القسم.المجموعة.الحقل  مثل  dl.list.q  أو  ds.add.lit
function setKey(path, val) {
  const [pre, grp, k] = path.split('.'); const P = PREFIX[pre]; if (!P) return null;
  const st = P.st[grp]; if (!st) return null;
  st[k] = val;
  if (k === 'fac') st.wh = '';
  if (k === 'kind') st.p = '';
  if (k === 'preset' && val === 'custom') { const [f, t] = presetRange({ preset: 'month' }); st.f = st.f || f; st.t = st.t || t; }
  if ('page' in st && k !== 'page') st.page = 0;
  return { P, grp, k };
}
document.addEventListener('change', e => {
  const path = e.target.dataset && e.target.dataset.k; if (!path) return;
  const r = setKey(path, e.target.type === 'checkbox' ? (e.target.checked ? '1' : '') : e.target.value); if (!r) return;
  if (r.P.quiet && r.P.quiet(r.grp, r.k)) return;
  if (r.grp === 'edit' && r.P.refreshEdit) return r.P.refreshEdit();
  App.render();
});
let _liveT = null;
document.addEventListener('input', e => {
  const path = e.target.dataset && e.target.dataset.k; if (!path) return;
  const [pre, grp, k] = path.split('.'); const P = PREFIX[pre]; if (!P || !P.st[grp]) return;
  if (P.quiet && P.quiet(grp, k)) { P.st[grp][k] = e.target.value; return; }
  if (e.target.dataset.live) {
    setKey(path, e.target.value); clearTimeout(_liveT);
    _liveT = setTimeout(() => { const pos = e.target.selectionStart; App.render(); const el = $(`[data-k="${path}"]`); if (el) { el.focus(); try { el.setSelectionRange(pos, pos); } catch (x) {} } }, 250);
  }
});
document.addEventListener('click', async e => {
  const t = e.target.closest('[data-tab],[data-nav],[data-act]'); if (!t) return;
  if (t.dataset.tab) { const [pre, k] = t.dataset.tab.split('.'); PREFIX[pre].st.tab = k; LS.set(`qw_${pre}_tab`, k); App.render(); return; }
  if (t.dataset.nav) { $('#side').classList.remove('open'); App.open(t.dataset.nav); return; }
  const a = t.dataset.act;
  if (a === 'close') return closeModal();
  if (a === 'sync') return App.sync();
  if (a === 'ob-show') return Outbox.show();
  if (a === 'pk-local') return Pack.open();
  if (a === 'pk-go') return Pack.go(t);
  if (a === 'ob-login') { LS.del('qw_offline_user'); return App.toLogin('عاد الإنترنت؛ سجّل الدخول ليتم إرسال ما سجّلته وأنت بدون إنترنت'); }
  if (a === 'ob-retry') { closeModal(); return Outbox.retry(t.dataset.id); }
  if (a === 'ob-discard') { Outbox.discard(t.dataset.id); closeModal(); Outbox.show(); return; }
  if (a === 'theme') { LS.set('qw_theme2', LS.get('qw_theme2', 'light') === 'dark' ? 'light' : 'dark'); return App.theme(); }
  if (a === 'menu') return $('#side').classList.toggle('open');
  if (a === 'logout' && Outbox.pending() && !t.dataset.sure) {
    return modal(`<h3>عمليات لم تُرسل بعد</h3><p>لديك <b>${Outbox.pending()}</b> عملية محفوظة على هذا الجهاز ولم تُرسل للسيرفر لأن الإنترنت مقطوع.</p>
      <p class="mut">لو سجّلت الخروج ستبقى محفوظة، وتُرسل تلقائيًا عندما تدخل بحسابك مرة أخرى من نفس الجهاز. الأفضل أن تنتظر عودة الإنترنت.</p>
      <div style="display:flex;gap:10px"><button class="btn ghost" data-act="close">البقاء</button><button class="btn danger" data-act="logout" data-sure="1">تسجيل الخروج على أي حال</button></div>`, 500);
  }
  if (a === 'logout') { closeModal(); LS.del('qw_offline_user'); clearInterval(App._hb); await App.beat(false); await API.logout(); await Cache.clear(); Object.values(T).forEach(x => { x.ready = false; x.rows = []; }); return App.toLogin(); }
  const [pre, ...rest] = a.split('-'); const P = PREFIX[pre]; const fn = P && P.act[rest.join('-')];
  if (fn) return fn(t);
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); if (e.key === 'Enter' && e.target.id === 'l-p') $('#l-go').click(); });
// ---------------- التثبيت كتطبيق على الجهاز ----------------
let _installEvt = null;
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').catch(() => {});
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); _installEvt = e; const b = $('#install-btn'); if (b) b.hidden = false; });
window.addEventListener('appinstalled', () => { _installEvt = null; const b = $('#install-btn'); if (b) b.hidden = true; toast('✓ تم تثبيت البرنامج على الجهاز'); });
document.addEventListener('click', async e => {
  if (!e.target.closest('#install-btn')) return;
  if (_installEvt) { _installEvt.prompt(); await _installEvt.userChoice; _installEvt = null; e.target.closest('#install-btn').hidden = true; }
});
App.start();

document.addEventListener('visibilitychange', () => { if (App._hb) App.beat(); });
window.addEventListener('pagehide', () => { if (App._hb) App.beat(false); });
</script>
</body>
