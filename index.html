<style>
/* الهوية: ورق دافئ مثل Claude، وطين محروق كلون أساسي، وكل الرسوم مجسّمة مثل كتل الفوم والبضاعة المرصوصة */
:root{
  --bg:#F3EFE7; --panel:#FBF8F2; --card:#FFFDF9; --card2:#F1EBE1; --line:#E2D9CB; --text:#2B2520; --muted:#7A7064;
  --accent:#C6613F; --accent-ink:#FFFFFF; --accent-deep:#9E4A2E; --gold:#C9962E; --good:#3F8A68; --warn:#C08A1E; --bad:#C4452E; --info:#4A78A8;
  --s1:#C6613F; --s2:#4A78A8; --s3:#3F8A68; --s4:#C9962E; --s5:#8D6BB0;
  --shadow:0 1px 0 rgba(255,255,255,.7) inset,0 1px 2px rgba(70,45,20,.06),0 10px 28px -12px rgba(70,45,20,.22);
  --lift:0 2px 0 var(--line);
  --grid-a:rgba(120,90,60,.06); --r:16px; --serif:'Noto Naskh Arabic',serif;
}
:root[data-theme="dark"]{
  --bg:#1D1B18; --panel:#23211D; --card:#2A2723; --card2:#332F2A; --line:#423C35; --text:#EFE8DE; --muted:#A99F92;
  --accent:#D97757; --accent-ink:#1D1B18; --accent-deep:#A9553A; --good:#5DB58B; --warn:#E0AE4A; --bad:#E2694F; --info:#79A6D6;
  --s1:#D97757; --s2:#79A6D6; --s3:#5DB58B; --s4:#E0AE4A; --s5:#B49AD6;
  --shadow:0 1px 0 rgba(255,255,255,.04) inset,0 12px 30px -14px rgba(0,0,0,.6);
  --grid-a:rgba(255,240,220,.035);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;font-size:15px;line-height:1.55}
button,input,select,textarea{font-family:inherit;font-size:14.5px;color:inherit}
a{color:var(--info)}
.hidden{display:none!important}
/* ---------- الهيكل ---------- */
.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
.side{background:var(--panel);border-left:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 6px 14px;border-bottom:1px solid var(--line);margin-bottom:8px}
.brand .logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--accent),#9B5DE5);display:grid;place-items:center;font-size:20px}
.brand b{font-size:16.5px}.brand small{display:block;color:var(--muted);font-size:12px}
.nav{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:var(--text);text-decoration:none;cursor:pointer;border:0;background:none;width:100%;text-align:right}
.nav:hover{background:var(--card2)}.nav.on{background:var(--card2);font-weight:800;box-shadow:inset -3px 0 0 var(--accent)}
.nav.soon{opacity:.55}.nav .tag{margin-right:auto;font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:20px;padding:1px 8px}
.side .foot{margin-top:auto;border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px;font-size:13px;color:var(--muted)}
.main{padding:22px 26px 60px;min-width:0}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.top h1{font-size:23px;margin:0}
.top .sync{margin-right:auto;color:var(--muted);font-size:13px;display:flex;gap:8px;align-items:center}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;border-bottom:1px solid var(--line);padding-bottom:10px}
.tab{padding:8px 16px;border-radius:22px;border:1px solid var(--line);background:var(--card);cursor:pointer}
.tab.on{background:var(--accent);border-color:var(--accent);color:#1A0E15;font-weight:800}
.menu-btn{display:none}
/* ---------- عناصر ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow)}
.grid{display:grid;gap:14px}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.s3{grid-column:span 3}.s8{grid-column:span 8}.s4{grid-column:span 4}.s7{grid-column:span 7}.s5{grid-column:span 5}.s6{grid-column:span 6}.s12{grid-column:span 12}
.g12{grid-template-columns:repeat(12,minmax(0,1fr))}
.kpi .l{color:var(--muted);font-size:13px}.kpi .v{font-size:28px;font-weight:800;margin:6px 0 2px;direction:ltr;text-align:right}
.kpi .n{font-size:12.5px}.up{color:var(--good)}.down{color:var(--bad)}.mut{color:var(--muted)}
.card h3{margin:0 0 4px;font-size:16px}.card .sub{color:var(--muted);font-size:12.5px;margin-bottom:10px}
.hero{background:linear-gradient(120deg,var(--card) 0%,var(--card2) 100%);position:relative;overflow:hidden}
.hero h2{margin:0 0 6px;font-size:22px}.hero p{margin:0;color:var(--muted);line-height:1.8}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.chip{border:1px solid var(--line);border-radius:20px;padding:3px 10px;font-size:12.5px;background:var(--card)}
.period{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px;font-size:13.5px}
.period .box{border:1px solid var(--line);border-radius:10px;padding:6px 12px;background:var(--card)}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:14px}
.f{display:flex;flex-direction:column;gap:4px;min-width:150px}.f label{font-size:12.5px;color:var(--muted)}
input,select,textarea{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:8px 10px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
.seg{display:flex;flex-wrap:wrap;gap:6px}.seg button{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:6px 14px;cursor:pointer}
.seg button.on{background:var(--card2);border-color:var(--accent);font-weight:800}
.btn{border:1px solid var(--accent);background:var(--accent);color:#1A0E15;border-radius:10px;padding:9px 18px;font-weight:800;cursor:pointer}
.btn.ghost{background:transparent;color:var(--text);border-color:var(--line)}.btn.danger{background:var(--bad);border-color:var(--bad);color:#200}
.btn:disabled{opacity:.5;cursor:not-allowed}.btn.sm{padding:5px 10px;font-size:13px;font-weight:700}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{position:sticky;top:0;background:var(--card2);text-align:right;font-weight:700;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
tr:hover td{background:rgba(127,127,127,.06)}
td.num,th.num{text-align:left;direction:ltr}
.tbl{overflow:auto;max-height:560px;border:1px solid var(--line);border-radius:12px}
.pager{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-top:10px;color:var(--muted);font-size:13px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;font-size:12.5px;color:var(--muted)}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:5px;vertical-align:middle}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:6px;vertical-align:middle}
.qgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 16px}
details.tools{margin-top:14px;border-top:1px dashed var(--line);padding-top:10px}details.tools summary{cursor:pointer;color:var(--muted);font-size:13px}
.gcard{border-inline-start:4px solid var(--gc)}
.inrow{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;margin-top:10px}.inrow .f{flex:1}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 18px;max-width:900px}
.form .full{grid-column:1/-1}
.err{background:rgba(240,122,90,.12);border:1px solid var(--bad);color:var(--bad);border-radius:10px;padding:10px 14px;margin:10px 0}
.ok{background:rgba(76,194,154,.12);border:1px solid var(--good);color:var(--good);border-radius:10px;padding:10px 14px;margin:10px 0}
.warnbox{background:rgba(232,176,75,.12);border:1px solid var(--warn);border-radius:10px;padding:10px 14px;margin:8px 0}
.infobox{background:rgba(111,182,232,.10);border:1px solid var(--info);border-radius:10px;padding:10px 14px;margin:8px 0}
.toast{position:fixed;bottom:22px;left:22px;z-index:99;background:var(--card2);border:1px solid var(--good);color:var(--text);padding:12px 18px;border-radius:12px;box-shadow:var(--shadow);max-width:420px}
.toast.bad{border-color:var(--bad)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;z-index:50;padding:16px}
.modal .card{width:min(900px,100%);max-height:92vh;overflow:auto}
.bars{display:flex;flex-direction:column;gap:8px}
.hb{display:grid;grid-template-columns:130px 1fr 64px;gap:10px;align-items:center;font-size:13.5px}
.hb .t{height:12px;border-radius:8px;background:var(--card2);overflow:hidden}.hb .t i{display:block;height:100%;border-radius:8px}
.hb .n{direction:ltr;text-align:left;font-weight:700}
.hb .k{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .mk{position:absolute;top:-3px;width:3px;height:18px;background:var(--text);border-radius:2px;transform:translateX(50%)}
.st-good{color:var(--good)}.st-warn{color:var(--warn)}.st-bad{color:var(--bad)}.st-miss{color:var(--muted)}
.pill{display:inline-block;padding:2px 10px;border-radius:20px;font-size:12.5px;font-weight:700;border:1px solid currentColor}
td input{width:130px;padding:6px 8px}
.rank{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:center;padding:7px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.rank:last-child{border-bottom:0}.rank .i{color:var(--muted);font-weight:800}.rank small{display:block;color:var(--muted);font-size:12px}
svg text{font-family:'IBM Plex Sans Arabic',sans-serif}
.empty{color:var(--muted);text-align:center;padding:30px}
/* ---------- الدخول ---------- */
.login{min-height:100vh;display:grid;place-items:center;padding:20px}
.login .card{width:min(420px,100%);padding:28px}
.login h1{margin:0 0 4px;font-size:24px}.login p{margin:0 0 18px;color:var(--muted)}
.login .f{margin-bottom:12px}
.spin{width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 0.8s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.loading{display:grid;place-items:center;min-height:60vh;color:var(--muted);gap:12px}
.bar-prog{width:260px;height:6px;border-radius:6px;background:var(--card2);overflow:hidden}.bar-prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}

/* ---------- الطبقة العصرية المجسّمة ---------- */
body{background:var(--bg) radial-gradient(1200px 600px at 100% -10%,color-mix(in srgb,var(--accent) 7%,transparent),transparent 70%) fixed}
.side{background:var(--panel);box-shadow:-1px 0 0 var(--line)}
.brand .logo{background:none;width:42px;height:42px}
.brand b{font-family:var(--serif);font-size:19px;font-weight:700}
.nav{border-radius:12px;font-weight:500;transition:background .15s}
.nav.on{background:var(--card);box-shadow:var(--shadow),inset -3px 0 0 var(--accent);font-weight:700}
.top h1{font-family:var(--serif);font-size:30px;font-weight:700;letter-spacing:0}
.tabs{border:0;padding:5px;background:var(--card2);border-radius:14px;display:inline-flex;box-shadow:inset 0 1px 3px rgba(0,0,0,.08)}
.tab{border:0;background:transparent;border-radius:10px;padding:8px 16px;color:var(--muted);font-weight:600}
.tab.on{background:var(--card);color:var(--text);box-shadow:0 1px 0 rgba(255,255,255,.6) inset,0 2px 0 var(--line),0 6px 14px -6px rgba(70,45,20,.35);font-weight:700}
.tab.on::before{content:'';display:inline-block;width:7px;height:7px;border-radius:2px;background:var(--accent);margin-inline-end:8px;transform:rotate(45deg) translateY(-1px)}
.card{border-color:var(--line);box-shadow:var(--shadow);border-radius:var(--r)}
.card h3{font-family:var(--serif);font-size:18px;font-weight:700}
.kpi{border-bottom:3px solid var(--line)}
.kpi .v{font-size:30px;font-weight:700;letter-spacing:-.01em;line-height:1.25}
.kpi .v small{font-family:'IBM Plex Sans Arabic',sans-serif;font-size:14px;font-weight:500;color:var(--muted)}
.hero{background:
  linear-gradient(30deg,var(--grid-a) 12%,transparent 12.5%,transparent 87%,var(--grid-a) 87.5%,var(--grid-a)),
  linear-gradient(150deg,var(--grid-a) 12%,transparent 12.5%,transparent 87%,var(--grid-a) 87.5%,var(--grid-a)),
  linear-gradient(30deg,var(--grid-a) 12%,transparent 12.5%,transparent 87%,var(--grid-a) 87.5%,var(--grid-a)),
  linear-gradient(150deg,var(--grid-a) 12%,transparent 12.5%,transparent 87%,var(--grid-a) 87.5%,var(--grid-a)),
  linear-gradient(60deg,color-mix(in srgb,var(--accent) 5%,transparent) 25%,transparent 25.5%,transparent 75%,color-mix(in srgb,var(--accent) 5%,transparent) 75%),
  linear-gradient(120deg,var(--card),var(--card2));
  background-size:56px 98px,56px 98px,56px 98px,56px 98px,56px 98px,100% 100%;
  background-position:0 0,0 0,28px 49px,28px 49px,0 0,0 0;padding:22px 24px}
.hero h2{font-family:var(--serif);font-size:30px;font-weight:700;line-height:1.45;margin-bottom:8px}
.hero p{font-size:15.5px;max-width:75ch}
.hero-split{display:grid;grid-template-columns:minmax(0,1fr) minmax(260px,42%);gap:18px;align-items:center}
.chip{background:var(--card);box-shadow:0 1px 0 var(--line)}
.btn{border-radius:12px;color:var(--accent-ink);box-shadow:0 3px 0 var(--accent-deep),0 8px 16px -8px var(--accent);transition:transform .08s,box-shadow .08s;font-weight:700}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--accent-deep)}
.btn.ghost{box-shadow:0 2px 0 var(--line);background:var(--card)}
.btn.ghost:active{box-shadow:0 0 0 var(--line)}
.btn.danger{color:#fff;box-shadow:0 3px 0 #8E2F1E}
input,select,textarea{background:var(--card);border-radius:11px;box-shadow:inset 0 1px 2px rgba(70,45,20,.06)}
input:focus,select:focus,textarea:focus{box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
th{background:var(--card2);font-weight:600;color:var(--muted)}
.tbl{border-radius:14px;background:var(--card)}
.hb .t{height:14px;border-radius:4px;box-shadow:inset 0 1px 2px rgba(0,0,0,.1)}
.hb .t i{border-radius:4px;background-image:linear-gradient(to bottom,rgba(255,255,255,.38),rgba(255,255,255,0) 45%,rgba(0,0,0,.14));box-shadow:0 2px 0 rgba(0,0,0,.12)}
.pill{border-radius:8px;background:color-mix(in srgb,currentColor 10%,transparent);border-color:color-mix(in srgb,currentColor 35%,transparent)}
.period .box{background:var(--card);border-radius:12px;box-shadow:0 1px 0 var(--line)}
.err,.ok,.warnbox,.infobox{border-radius:12px;border-width:0;border-inline-start:4px solid}
.err{border-inline-start-color:var(--bad)}.ok{border-inline-start-color:var(--good)}.warnbox{border-inline-start-color:var(--warn)}.infobox{border-inline-start-color:var(--info)}
.toast{border-radius:14px;border-width:0;border-inline-start:4px solid var(--good)}.toast.bad{border-inline-start-color:var(--bad)}
.modal{background:rgba(40,28,18,.45);backdrop-filter:blur(3px)}
.login{background:radial-gradient(800px 500px at 50% 0%,color-mix(in srgb,var(--accent) 12%,transparent),transparent 70%)}
.login h1,.login .brand b{font-family:var(--serif)}
.login .art{display:block;margin:0 auto 6px}
.pie-total{text-align:center;font-size:24px;font-weight:700;margin-top:-4px}.pie-total small{display:block;font-family:'IBM Plex Sans Arabic';font-size:12px;color:var(--muted);font-weight:500}
@media (max-width:820px){.hero-split{grid-template-columns:1fr}.top h1{font-size:24px}.hero h2{font-size:24px}.tabs{display:flex}}

@media (max-width:820px){
  .filters .f{flex:1 1 100%}
  .app{grid-template-columns:1fr}.side{position:fixed;inset:0 0 0 auto;width:270px;z-index:40;transform:translateX(100%);transition:transform .2s}
  .side.open{transform:none}.menu-btn{display:inline-flex}.main{padding:14px 14px 60px}.form{grid-template-columns:1fr}.qgrid{grid-template-columns:1fr 1fr}
  .g4,.g3,.g2{grid-template-columns:1fr}.hb{grid-template-columns:100px 1fr 54px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

#net{display:inline-flex;gap:6px;flex-wrap:wrap;align-items:center}

function lastMonths(n, upto = thisMonth()) { const out = [upto]; while (out.length < n) out.unshift(prevMonth(out[0])); return out; }
function dlabel(s) { const [y, m, d] = s.split('-'); return `${+d} ${MONTHS[+m - 1]} ${y}`; }

  if (f === t) return dlabel(f);
  const [fy, fm, fd] = f.split('-').map(Number), [ty, tm, td] = t.split('-').map(Number);
  if (fy === ty && fm === tm) {
    if (fd === 1 && td === lastDay(ty, tm)) return `${MONTHS[fm - 1]} ${fy}`;

function prevWindow(f, t) {
  const [fy, fm, fd] = f.split('-').map(Number), [ty, tm, td] = t.split('-').map(Number);
  if (fd === 1 && fy === ty && fm === tm) {
    const p = prevMonth(f.slice(0, 7)), pd = Math.min(td, lastDay(+p.slice(0, 4), +p.slice(5, 7)));
    return [`${p}-01`, `${p}-${String(pd).padStart(2, '0')}`];

const ERR_AR = {

const API = {

  saveSession(s) { this.session = s; s ? LS.set('qw_session', JSON.stringify(s)) : LS.del('qw_session'); },
  async raw(method, path, { body, headers = {}, auth = true, timeout = 30000 } = {}) {

  async login(user, password) {

        if (!r.ok) { this.saveSession(null); throw new ApiError(401, 'auth', 'انتهت الجلسة؛ سجّل الدخول من جديد'); }
        this.saveSession({ access_token: j.access_token, refresh_token: j.refresh_token, expires_at: j.expires_at || (Date.now() / 1000 + (j.expires_in || 3600)) });
      })().finally(() => { this._refreshing = null; });

  // طلب REST مع تجديد الجلسة تلقائيًا
  async rest(method, path, { body, prefer, retry = true } = {}) {

    const headers = {}; if (prefer) headers.Prefer = prefer;
    const r = await this.raw(method, '/rest/v1/' + path, { body, headers });
    if (r.status === 401 && retry && this.session) { await this.refresh(); return this.rest(method, path, { body, prefer, retry: false }); }
    const text = method === 'HEAD' ? '' : await r.text();

  async count(table, filter = '') {

    const m = /\/(\d+)$/.exec(r.range || ''); return m ? +m[1] : (r.data || []).length;
  },
  // كل الصفوف على صفحات متوازية (كل صفحة 1000 صف)
  async selectAll(table, cols, filter = '', onProgress) {
    const n = await this.count(table, filter);
    const pages = Math.max(1, Math.ceil(n / PAGE)); const out = new Array(pages); let done = 0, next = 0;
    const worker = async () => {

  async update(table, id, patch) {

  async rpc(fn, args = {}) { return (await this.rest('POST', 'rpc/' + fn, { body: args })).data; },

  },

// ذاكرة البيانات على الجهاز (IndexedDB) لفتح فوري، ثم مزامنة التغييرات فقط
// ============================================================================
const Cache = {
  db: null,
  async open() {
    if (this.db) return this.db;
    this.db = await new Promise((ok, no) => { const r = indexedDB.open('qattami-web', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error); });
    return this.db;
  },
  async get(k) { try { const d = await this.open(); return await new Promise(ok => { const q = d.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => ok(q.result); q.onerror = () => ok(null); }); } catch (e) { return null; } },
  async set(k, v) { try { const d = await this.open(); await new Promise(ok => { const t = d.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = ok; t.onerror = ok; }); } catch (e) {} },
  // يمسح بيانات الجداول فقط (المفاتيح t:...)، ويُبقي إعدادات الجهاز مثل مجلد النسخ الاحتياطي
  async clear() { try { const d = await this.open(); await new Promise(ok => { const t = d.transaction('kv', 'readwrite'), st = t.objectStore('kv'), q = st.openCursor();
    q.onsuccess = () => { const c = q.result; if (c) { if (String(c.key).startsWith('t:')) c.delete(); c.continue(); } }; t.oncomplete = ok; t.onerror = ok; }); } catch (e) {} },
};

// الجداول: تحميل كامل أول مرة (أو من الذاكرة)، ثم مزامنة: الجديد بالرقم + المعدّل بطابع الوقت + الحذف بالعدد
// ============================================================================
class Table {
  constructor(name, cols, { stamp = null, small = false } = {}) { this.name = name; this.cols = cols; this.stampCol = stamp; this.small = small; this.rows = []; this.ready = false; this.v = 0; }
  stamp() { let s = ''; if (!this.stampCol) return s; for (const x of this.rows) { const t = x[this.stampCol] || x.created_at || ''; if (t > s) s = t; } return s; }
  async load(onProgress) {
    if (this.ready) return 'mem';
    if (this.small) {   // الجداول الصغيرة: من السيرفر دائمًا، ومن الذاكرة لو مفيش إنترنت
      try { this.rows = await API.selectAll(this.name, this.cols, '', onProgress); }
      catch (e) { const c = await Cache.get('t:' + this.name); if (e.code !== 'network' || !c) throw e; this.rows = c.rows; }
      this.ready = true; this.v++; this.save(); return 'full';
    }
    const c = await Cache.get('t:' + this.name);
    if (c && c.url === CFG.url && c.cols === this.cols) { this.rows = c.rows; this.ready = true; this.v++; onProgress && onProgress(1); this._cached = true; return 'cache'; }
    this.rows = await API.selectAll(this.name, this.cols, '', onProgress); this.ready = true; this.v++; this.save(); return 'full';
  }
  save() { Cache.set('t:' + this.name, { url: CFG.url, cols: this.cols, rows: this.rows, at: Date.now() }); }
  async sync() {
    if (!this.ready) return false;
    if (this.small) { const rows = await API.selectAll(this.name, this.cols); const ch = JSON.stringify(rows) !== JSON.stringify(this.rows); this.rows = rows; if (ch) this.v++; return ch; }
    const maxId = this.rows.reduce((m, x) => Math.max(m, x.id), 0), st = this.stamp();
    const [n, fresh, changed] = await Promise.all([
      API.count(this.name), API.selectAll(this.name, this.cols, `id=gt.${maxId}`),
      st ? API.selectAll(this.name, this.cols, `${this.stampCol}=gt.${encodeURIComponent(st)}`) : Promise.resolve([])]);
    const byId = new Map(this.rows.map(x => [x.id, x]));
    for (const x of [...fresh, ...changed]) byId.set(x.id, x);
    let rows = [...byId.values()];
    if (rows.length !== n) rows = await API.selectAll(this.name, this.cols);
    // السجلات المحفوظة على الجهاز ولم تُرسل بعد (رقم مؤقت سالب) تبقى ظاهرة
    for (const x of this.rows) if (x.id < 0 && !rows.some(y => y.id === x.id)) rows.push(x);
    const ch = rows.length !== this.rows.length || fresh.length || changed.length;
    this.rows = rows; if (ch) { this.v++; this.save(); }
    return !!ch;
  }
  put(row) { const i = this.rows.findIndex(x => x.id === row.id); if (i >= 0) this.rows[i] = row; else this.rows.push(row); this.v++; this.save(); }
  drop(ids) { const s = new Set([].concat(ids)); this.rows = this.rows.filter(x => !s.has(x.id)); this.v++; this.save(); }
}

const shade = (c, p) => `color-mix(in srgb, ${c} ${100 - Math.abs(p)}%, ${p > 0 ? '#ffffff' : '#000000'})`;
function prism(x, y, w, h, c, dx, dy, title = '', top = true) {

ter saving, the factory, item, warehouse and dates stay, so the next batch is quick to enter"],["تُملأ قراءة البداية تلقائيًا من نهاية الشهر السابق إن وُجدت. لو العداد لفّ (من 9xx","The start reading is filled from the previous month's end when available. If the odometer rolled over (from 9xx"],["يُدار العمال (تفعيل «مؤشر الأداء» لكل عامل) والمخازن من «البيانات الأساسية» للمدير","Workers (the «performance index» flag) and warehouses are managed in «Master data» by the administrator"],["كل ما سبق في كل الأقسام، بالإضافة إلى المستخدمين والبيانات الأساسية والنسخ الاحتياطي","all of the above in every section, plus users, master data and backups"],["لأن له كميات في سندات سابقة؛ استخدم «إيقاف» بدلًا من الحذف حتى تبقى أرقامه في التقارير","because it has quantities in earlier records; use «Stop» instead so its numbers stay in the reports"],["الجرد اليومي تحت الحد اليومي يظهر في التنبيهات، والعامل تحت الحد الشهري يظهر باللون الأحمر","A daily count below the daily threshold appears in the alerts, and a worker below the monthly threshold is shown in red"],["كفاءة الأسطول (كم/لتر) مقسومة على المعدل الطبيعي المسجَّل لكل مركبة؛ 100 عند الطبيعي أو أفضل","Fleet km/L divided by each vehicle's recorded normal rate; 100 at or above normal"],["كل سجل لعامل واحد. بعد الحفظ يبقى التاريخ والمخزن وعدد الأصناف كما هي لتسجيل العامل التالي بسرعة","One worker per record. After saving, the date, warehouse and items stay, so the next worker is quick to enter"],["اترك الدرجة فارغة لتأخذ درجة النوع: حرج 5، متوسط 3، بسيط 1. الموظفون يُدارون من «البيانات الأساسية» للمدير","Leave the weight empty to use the type's default: critical 5, medium 3, minor 1. Employees are managed in «Master data» by the administrator"],["سند لكل منطقة. بعد الحفظ يبقى المصنع والمخزن والتاريخ والسائق والمركبة كما هي، لتسجيل المنطقة التالية بسرعة","One record per region. After saving, the factory, warehouse, date, driver and vehicle stay, so the next region is quick to enter"],["يمكنك تغيير اسم أي مجموعة أو ترتيبها أو مصنعها، أو إلغاء «مفعّلة» لإخفائها من السند دون حذف بياناتها السابقة","You can rename, reorder or change the factory of any group, or untick «Active» to hide it from the record without deleting its history"],["البنود: عدّل الاسم ثم «حفظ»، أو «إيقاف» لإخفائه من السند مع بقاء أرقامه القديمة، أو «حذف» لو لم تُسجَّل له كميات أبدًا","Items: edit the name then «Save», or «Stop» to hide it from the record while keeping its old numbers, or «Delete» if it never had quantities"],["عدّل مباشرة في الجدول ثم اضغط «حفظ التعديلات». إيقاف «مفعّل» يخفيه من النماذج دون أن يمس السجلات القديمة. الحذف متاح فقط لما ليس عليه أي سجلات","Edit directly in the table, then press «Save changes». Unticking «Active» hides it from forms without touching old records. Deleting is only possible when there are no records"],["لكل حدث نوع (حرج / متوسط / بسيط) ودرجة تحددها بنفسك؛ تقييم الموظف بمجموع درجات أحداثه السلبية. الأحداث غير السلبية (مثل المرضية) تُسجَّل فقط ودرجتها صفر","Each event has a type (critical / medium / minor) and a weight you set; an employee's rating is the sum of their negative event weights. Non-negative events (e.g. sick leave) are recorded only, with zero weight"],["عند فتح البرنامج من هذا الجهاز بحساب مدير، يحفظ نسخة تلقائيًا لو مرّت المدة المحددة. ولو المتصفح طلب إذنًا، يظهر لك زر «حفظ نسخة احتياطية الآن» في الرئيسية","When an administrator opens the program on this device, a backup is saved automatically once the set period has passed. If the browser asks for permission, a «Save a backup now» button appears on Home"],["ملف Excel فيه كل بيانات البرنامج: ورقة لكل جدول (الأوردرات، الصيانة، الديزل، المواد، الجرد، الموظفون، البضاعة، القوائم، المستخدمون وسجل النشاط). كلمات المرور لا تُحفظ فيه","An Excel file with all program data: one sheet per table (orders, maintenance, diesel, materials, counts, staff, goods, lists, users and the activity log). Passwords are not included"],["اختر المصنع أولًا، ثم الدفعة والمخزن المستلم. التحويل إلى مخزن من مخازنك ينقل الكمية ويبقيها في رصيدك، أما التحويل إلى مخزن الإنتاج فيُخرجها من رصيدك ولا يتابعها البرنامج بعد ذلك","Choose the factory first, then the batch and the receiving warehouse. A transfer to one of your warehouses moves the quantity and keeps it in your stock; a transfer to a production warehouse takes it out of your stock"],["اختر المصنع أولًا فتظهر مجموعاته. لكل مجموعة سند مستقل بتاريخه: اختر التاريخ (الافتراضي اليوم)، واكتب الكميات، ثم احفظ سند المجموعة. يمكن تسجيل أكثر من سند للمجموعة نفسها في الشهر، والتقارير تجمعها","Choose the factory first to see its groups. Each group has its own dated record: pick the date (today by default), enter the quantities, then save that group's record. A group can have several records a month; reports add them up"],["عن","from"],["عرض","Show"],["صنف","items"],["ملف","file"],["رحلة","trips"],["ملخص","Summary of"],["حُذف","Deleted"],["تنزيل","Download"],["إيقاف","Stop"],["أُوقف","Stopped"],["تغطية","Coverage"],["الصنف","Item"],["إغلاق","Close"],["سلبية","Negative"],["عادية","Normal"],["صحيحًا","valid"],["بمتوسط","averaging"],["النسبة","Share"],["يوميًا","per day"],["الطبيعي","normal"],["تنبيهات","Alerts"],["المتوسط","Average"],["يوم عمل","working days"],["القائمة","List"],["أعلى يوم","Peak day"],["أعلى شهر","Peak month"],["أعلى سائق","Top driver"],["حسب الشهر","By month"],["من الرصيد","of stock"],["أفضل عامل","Best worker"],["في المجلد","in the folder"],["حسب المخزن","By warehouse"],["حسب المصنع","By factory"],["حسب السائق","By driver"],["عدد الشهور","Months"],["المستلم في","Received in"],["من الأحداث","of events"],["أحداث حرجة","Critical events"],["لديك اليوم","for you today"],["ملف النسخة","Backup file"],["حسب السيارة","By vehicle"],["أعلى مجموعة","Top group"],["لم يبلغ أحد","Nobody has reached"],["المقارنة بـ","Compared with"],["درجة كل قسم","Score per section"],["أوردر للرحلة","orders per trip"],["لترات الفترة","Litres in period"],["نسبة اللترات","Share of litres"],["عدد الفواتير","Invoices"],["آخر الفواتير","Latest invoices"],["تفصيل البنود","Item breakdown"],["الر const Lang = {
  get() { try { return localStorage.getItem('qw_lang') === 'en' ? 'en' : 'ar'; } catch { return 'ar'; } },
  en() { return this.get() === 'en'; },
  toggle() { try { localStorage.setItem('qw_lang', this.en() ? 'ar' : 'en'); } catch {} location.reload(); },
  btn(cls = 'btn ghost sm') { return `<button class="${cls}" data-lang-btn type="button">🌐 ${this.en() ? 'العربية' : 'English'}</button>`; },
  _map: null, _re: null,
  build() {
    this._map = new Map(I18N_EN.map(([a, b]) => [a.normalize('NFC'), b]));
    const keys = [...this._map.keys()].sort((a, b) => b.length - a.length).map(k => k.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
    this._re = new RegExp('(?<![\\u0620-\\u065F\\u066E-\\u06D3])(?:' + keys.join('|') + ')(?![\\u0620-\\u065F\\u066E-\\u06D3])', 'g');
  },
  tr(s) {
    if (!s || !/[؀-ۿ]/.test(s)) return s;
    const n = s.normalize('NFC');
    let o = n.replace(this._re, m => this._map.get(m) ?? m);
    // نص فيه بيانات عربية (اسم، وصف): لا نترجم الكلمات المفردة حتى لا يتشوه
    if (/[\u0600-\u06FF]/.test(o)) o = n.replace(this._re, m => m.includes(' ') ? (this._map.get(m) ?? m) : m);
    return o.replace(/،/g, ',').replace(/؛/g, ';').replace(/؟/g, '?');
  },
  skip(el) { return el && (el.closest?.('[data-no-tr]') || el.tagName === 'SCRIPT' || el.tagName === 'STYLE' || el.tagName === 'TEXTAREA'); },
  walk(root) {
    if (root.nodeType === 3) { if (!this.skip(root.parentElement)) { const t = this.tr(root.nodeValue); if (t !== root.nodeValue) root.nodeValue = t; } return; }
    if (root.nodeType !== 1 || this.skip(root)) return;
    this.attrs(root);
    const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT | NodeFilter.SHOW_ELEMENT);
    let n; while ((n = w.nextNode())) {
      if (n.nodeType === 1) { this.attrs(n); continue; }
      if (this.skip(n.parentElement)) continue;
      const t = this.tr(n.nodeValue); if (t !== n.nodeValue) n.nodeValue = t;
    }
  },
  attrs(el) {
    for (const a of ['placeholder', 'title', 'aria-label']) { const v = el.getAttribute(a); if (v) { const t = this.tr(v); if (t !== v) el.setAttribute(a, t); } }
    if (el.tagName === 'INPUT' && (el.type === 'button' || el.type === 'submit') && el.value) el.value = this.tr(el.value);

    catch (e) { if (e.code === '23505') { await Data.lookups(); const x = [...Data.reg.values()].find(y => y.name === name); if (x) return x.id; } throw e; }
  },
  nextNo() {

  async save(btn) {

  openEdit(id) {

  async saveEdit(btn) {

    if (errs.length) { box.innerHTML = `<div class="err">${errs.map(esc).join('<br>')}</div>`; return; }

  confirmDel(id) {

      <div style="display:flex;gap:10px"><button class="btn danger" data-act="dl-do-del" data-id="${id}">نعم، احذف</button><button class="btn ghost" data-act="close">إلغاء</button></div>`, 480);
  },

  // ---------------- التقارير ----------------
  rep() {
    const st = this.st.rep, d = this.filter(st), [f, t] = presetRange(st, this.rows().map(r => r.date));
    const head = `<div class="filters">${periodControls('dl.rep', st)}${this.facSelect('dl.rep', st)}${this.whSelect('dl.rep', st)}${this.pickers('dl.rep', st)}</div>
      <div class="period"><span class="box">📅 ${spanText(f, t)}</span></div>`;
    if (!d.length) return head + '<div class="empty">لا توجد سندات في هذه الفترة</div>';
    const total = d.reduce((s, r) => s + r.o, 0), days = new Set(d.map(r => r.date)).size;
    const agg = key => { const m = new Map(); for (const r of d) { const k = key(r); const x = m.get(k) || { o: 0, k: 0, regs: new Set(), days: new Set() }; x.o += r.o; x.k++; x.regs.add(r.rid); x.days.add(r.date); m.set(k, x); } return [...m.entries()].sort((a, b) => b[1].o - a[1].o); };
    const reg = agg(r => r.r), drv = agg(r => r.d), wh = agg(r => r.f + (r.wid ? ' — ' + r.w : '')), day = agg(r => r.date).sort((a, b) => a[0] < b[0] ? 1 : -1);
    this._rep = { f, t, d, csv: {
      reg: [['المنطقة', 'الأوردرات', 'الرحلات', 'أيام التوصيل', 'النسبة %'], ...reg.map(([k, x]) => [k, x.o, x.k, x.days.size, Math.round(x.o / total * 1000) / 10])],
      drv: [['السائق', 'الأوردرات', 'الرحلات', 'المناطق', 'أيام العمل'], ...drv.map(([k, x]) => [k, x.o, x.k, x.regs.size, x.days.size])],
      wh: [['المصنع / المخزن', 'الأوردرات', 'الرحلات', 'المناطق'], ...wh.map(([k, x]) => [k, x.o, x.k, x.regs.size])],
      day: [['التاريخ', 'الأوردرات', 'الرحلات', 'المناطق'], ...day.map(([k, x]) => [k, x.o, x.k, x.regs.size])] } };
    const tbl = (title, key) => { const [h, ...rows] = this._rep.csv[key]; return `<div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><h3>${title}</h3><button class="btn ghost sm" data-act="dl-csv" data-key="${key}">⬇️ CSV</button></div>
      <div style="margin-top:8px">${table(h, rows.map(r => r.map((v, i) => i ? fmt(v, v % 1 ? 1 : 0) : esc(v))), { num: h.map((_, i) => i).slice(1), max: 420 })}</div></div>`; };
    return head + `<div class="grid g4" style="margin-bottom:14px">${kpi('الأوردرات', fmt(total))}${kpi('الرحلات', fmt(d.length))}${kpi('المناطق', fmt(reg.length))}
        ${kpi('أيام العمل', fmt(days), `<span class="mut">متوسط ${fmt(total / days, 1)} يوميًا</span>`)}</div>
      <div style="margin-bottom:14px"><button class="btn" data-act="dl-export-all">⬇️ تنزيل كل السندات في الفترة (CSV)</button></div>
      <div class="grid g2">${tbl('حسب المنطقة', 'reg')}${tbl('حسب السائق', 'drv')}${tbl('حسب المصنع والمخزن', 'wh')}${tbl('حسب اليوم', 'day')}</div>`;
  },
  exportRows(rows, name) {
    download(name, [['رقم السند', 'التاريخ', 'المصنع', 'المخزن', 'السائق', 'المركبة', 'المنطقة', 'عدد الأوردرات', 'ملاحظات', 'سجّلها'],
      ...rows.map(r => [r.no, r.date, r.f, r.w, r.d, r.v, r.r, r.o, r.notes, r.by])]);
  },
  act: {
    'save': (t) => Deliveries.save(t), 'save-edit': (t) => Deliveries.saveEdit(t),
    'clear': () => { const s = Deliveries.st.add; Deliveries.st.add = { fac: s.fac, wh: '', date: '', drv: '', veh: '', reg: '', regNew: '', orders: '', notes: '' }; App.render(); },
    'edit': (t) => Deliveries.openEdit(+t.dataset.id), 'del': (t) => Deliveries.confirmDel(+t.dataset.id), 'do-del': (t) => Deliveries.doDel(+t.dataset.id, t),
    'pg': (t) => { Deliveries.st.list.page += +t.dataset.d; App.render(); },
    'export-list': () => Deliveries.exportRows(Deliveries.filter(Deliveries.st.list), `deliveries_${today()}.csv`),
    'export-all': () => { const R = Deliveries._rep; if (R) Deliveries.exportRows(R.d, `deliveries_${R.f}_${R.t}.csv`); },
    'csv': (t) => { const R = Deliveries._rep; if (R) download(`deliveries_${t.dataset.key}_${R.f}_${R.t}.csv`, R.csv[t.dataset.key]); },
  },
};
// ============================================================================
// قسم تعبئة الديزل
// ============================================================================
const STATUS = {
  normal: ['طبيعي', 'st-good', '#22A285'], acceptable: ['مقبول', 'st-warn', '#E8B04B'],
  abnormal: ['غير طبيعي', 'st-bad', '#DD6A49'], missing: ['قراءات ناقصة', 'st-miss', '#5C7480'],
};
const pill = code => `<span class="pill ${STATUS[code][1]}">${STATUS[code][0]}</span>`;
const Diesel = {
  key: 'diesel', title: 'تعبئة الديزل', icon: '⛽', tables: ['refuels', 'odometer', 'settings'],
  st: {
    tab: LS.get('qw_ds_tab', 'dash'),
    dash: { kind: 'month', p: '' }, mon: { month: '' }, add: { veh: '', drv: '', lit: '', date: '' },
    q: { preset: 'month', f: '', t: '', veh: '', drv: '' }, del: { typed: '' },
  },
  quiet(grp, k) { return grp === 'add' || grp === 'del'; },
  general() { const v = parseFloat(setting('diesel_general_rate', '5')); return v > 0 ? v : 5; },
  natural(vid) { const v = Data.veh.get(vid); const r = v && v.diesel_rate !== null && v.diesel_rate !== undefined && v.diesel_rate !== '' ? +v.diesel_rate : null; return r > 0 ? r : this.general(); },
  rows() {
    const t = T.refuels;
    if (this._v === t.v && this._lv === Data.lv) return this._rows;
    this._rows = t.rows.map(x => { const v = Data.veh.get(x.vehicle_id) || {}, d = Data.emp.get(x.driver_id) || {};
      return { id: x.id, date: x.date, ym: x.date.slice(0, 7), vid: x.vehicle_id, did: x.driver_id, v: v.number || '?', vt: v.type || '', d: d.name || '?', l: +x.liters || 0, by: x.created_by || '' }; })
      .sort((a, b) => a.date < b.date ? 1 : a.date > b.date ? -1 : b.id - a.id);
    this._v = t.v; this._lv = Data.lv; return this._rows;
  },
  odo(month, vid) { return T.odometer.rows.find(x => x.month === month && x.vehicle_id === vid) || null; },
  // المسافة: النهاية − البداية؛ ولو العداد لفّ (من 9xx,xxx إلى رقم صغير) نحسبها صح
  distance(s, e) {
    if (s === null || s === undefined || e === null || e === undefined || s === '' || e === '') return { km: null };
    s = +s; e = +e;
    if (e > s) return { km: e - s };
    if (s >= 900000 && e < 100000) return { km: e + 1000000 - s, roll: true };
    return { km: null, bad: e < s };
  },
  status(eff, nat) { if (!eff || eff <= 0 || !nat) return 'missing'; const r = eff / nat; return r >= 0.9 ? 'normal' : r >= 0.75 ? 'acceptable' : 'abnormal'; },
  summary(rows, month) {
    const g = new Map();
    for (const r of rows) { const x = g.get(r.vid) || { vid: r.vid, v: r.v, vt: r.vt, l: 0, n: 0 }; x.l += r.l; x.n++; g.set(r.vid, x); }
    return [...g.values()].map(x => {
      const o = this.odo(month, x.vid) || {}, dd = this.distance(o.start_km, o.end_km), nat = this.natural(x.vid);
      const eff = dd.km && x.l > 0 ? Math.round(dd.km / x.l * 100) / 100 : null;
      return { ...x, start: o.start_km ?? null, end: o.end_km ?? null, km: dd.km, roll: dd.roll, eff, nat, code: this.status(eff, nat) };
    }).sort((a, b) => b.l - a.l);
  },
  monthsWithData() { return [...new Set(this.rows().map(r => r.ym))].sort().reverse(); },
  render() {
    const lv = Data.level('diesel');
    if (lv < 1) return `<div class="err">ليست لديك صلاحية على قسم تعبئة الديزل. اطلبها من المدير.</div>`;
    const tabs = [['dash', 'لوحة المعلومات'], ['mon', 'السند الشهري'], ['months', 'الشهور'], ['rep', 'التقارير'], ...(lv >= 3 ? [['set', 'الإعدادات']] : [])];
    if (!tabs.some(t => t[0] === this.st.tab)) this.st.tab = 'dash';
    return tabsBar(tabs, this.st.tab, 'ds') + this[this.st.tab]();
  },

  // ---------------- لوحة المعلومات ----------------
  // ملخص فترة من عدة أشهر: نجمع لترات كل مركبة، والمسافة من الأشهر التي لها قراءات عداد فقط
  periodSummary(rows) {
    const by = new Map();
    for (const m of [...new Set(rows.map(r => r.ym))].sort()) for (const x of this.summary(rows.filter(r => r.ym === m), m)) {
      const o = by.get(x.vid) || { vid: x.vid, v: x.v, vt: x.vt, l: 0, n: 0, km: 0, lm: 0, nat: x.nat, roll: false, start: null, end: null, months: 0 };
      o.l += x.l; o.n += x.n; o.months++; if (x.km) { o.km += x.km; o.lm += x.l; } if (x.roll) o.roll = true; o.start = x.start; o.end = x.end; by.set(x.vid, o);
    }
    return [...by.values()].map(o => { const eff = o.lm ? Math.round(o.km / o.lm * 100) / 100 : null;
      return { ...o, km: o.km || null, start: o.months === 1 ? o.start : null, end: o.months === 1 ? o.end : null, eff, code: this.status(eff, o.nat) }; }).sort((a, b) => b.l - a.l);
  },
  fleetOf(s) { const m = s.filter(x => x.km), km = m.reduce((a, x) => a + x.km, 0), l = m.reduce((a, x) => a + x.lm, 0);
    return [l ? km / l : null, l ? m.reduce((a, x) => a + x.nat * x.lm, 0) / l : this.general(), km]; },
  dash() {
    const all = this.rows();
    if (!all.length) return `<div class="card hero"><h2>لا توجد بيانات بعد</h2><p>ابدأ من تبويب «السند الشهري» بتسجيل التعبئات.</p></div>`;
    const st = this.st.dash, c = cmpPeriod(st, all.map(r => r.date)), { f, t, pf, pt } = c, month = t.slice(0, 7);
    const d = all.filter(r => r.date >= f && r.date <= t), pd = all.filter(r => r.date >= pf && r.date <= pt);
    const s = this.periodSummary(d), lit = d.reduce((a, r) => a + r.l, 0), prevL = pd.reduce((a, r) => a + r.l, 0);
    // كفاءة العام الماضي: بالأشهر الكاملة لنفس الفترة (القراءات شهرية)
    const lyFull = all.filter(r => r.date >= pf && r.date <= periodBounds(c.kind, lastYearKey(c.kind, c.key))[1]);
    const [fleet, fleetNat, mKm] = this.fleetOf(s), [lyFleet] = this.fleetOf(this.periodSummary(lyFull));
    const abn = s.filter(x => x.code === 'abnormal'), acc = s.filter(x => x.code === 'acceptable'), miss = s.filter(x => x.code === 'missing');
    const change = prevL ? (lit / prevL - 1) * 100 : null, ratio = fleet ? fleet / fleetNat * 100 : 0;
    const months = lastMonths(12, month), ml = groupSum(all.filter(r => r.ym >= months[0] && r.ym <= month), r => r.ym, r => r.l);
    const byDrv = sortDesc(groupSum(d, r => r.d, r => r.l)), byType = sortDesc(groupSum(d, r => r.vt || '—', r => r.l));
    const alerts = [
      ...[...abn].sort((a, b) => a.eff / a.nat - b.eff / b.nat).slice(0, 4).map(x => ['bad', `المركبة <b>${esc(x.v)}</b> تقطع ${fmt(x.eff, 1)} كم لكل لتر والطبيعي ${fmt(x.nat, 1)} (أقل بنسبة ${fmt((1 - x.eff / x.nat) * 100)}%). قد يوجد تسريب أو تعبئة غير دقيقة.`]),
      ...(abn.length > 4 ? [['bad', `و${abn.length - 4} مركبة أخرى باستهلاك غير طبيعي: ${esc([...abn].sort((a, b) => a.eff / a.nat - b.eff / b.nat).slice(4).map(x => x.v).join('، '))}. لو المعدل الطبيعي غير مضبوط لكل مركبة، اضبطه من تبويب «الإعدادات».`]] : []),
      ...(acc.length ? [['warn', `${acc.length} مركبة في نطاق «مقبول»: ${esc(acc.map(x => x.v).join('، '))}. راقبها الشهر القادم.`]] : []),
      ...(miss.length ? [['info', `تنقص قراءات العداد للمركبات: ${esc(miss.map(x => x.v).join('، '))}.`]] : []),
      ...s.filter(x => x.roll).map(x => ['info', `عداد المركبة <b>${esc(x.v)}</b> لفّ هذا الشهر (من ${fmt(x.start)} إلى ${fmt(x.end)})، وحُسبت المسافة ${fmt(x.km)} كم.`])];
    const ss = [...s].sort((a, b) => (b.eff ?? -1) - (a.eff ?? -1));
    if (!d.length) return `<div class="filters">${periodPicker('ds.dash', st, c)}</div>${cmpHead(c)}<div class="card hero"><h2>لا توجد تعبئات في ${c.name}</h2><p>${prevL ? `في نفس الفترة من العام الماضي: ${fmt(prevL)} لتر` : ''}</p></div>`;
    return `<div class="filters">${periodPicker('ds.dash', st, c)}</div>${cmpHead(c)}
      <div class="grid g12">
      <div class="card hero s12"><h2>استهلاك الديزل في ${c.name}: <bdi>${fmt(lit)}</bdi> لتر</h2>
        <p>متوسط الأسطول ${fleet ? fmt(fleet, 1) : '—'} كم لكل لتر مقابل معدل طبيعي ${fmt(fleetNat, 1)}. ${abn.length} مركبة باستهلاك غير طبيعي، و${miss.length} مركبة تنقصها قراءات العداد.</p>
        <div class="chips"><span class="chip">${fmt(lit)} لتر على ${s.length} مركبة</span><span class="chip">${fmt(mKm)} كم مقطوعة</span>
        <span class="chip">${s.filter(x => x.code === 'normal').length} مركبة طبيعية</span>${change !== null ? `<span class="chip">مقارنة بالعام الماضي ${change >= 0 ? '+' : ''}${fmt(change)}%</span>` : ''}</div></div>
      <div class="s12 grid g4">
        ${kpi('لترات الفترة', fmt(lit), vsLY(lit, prevL ? prevL : null, { higherGood: false }))}
        ${kpi('متوسط الأسطول', fleet ? fmt(fleet, 1) + ' <small>كم/لتر</small>' : '—', fleet && lyFleet ? vsLY(fleet, lyFleet, { dec: 1 }) : `<span class="mut">المعدل الطبيعي ${fmt(fleetNat, 1)}</span>`)}
        ${kpi('استهلاك غير طبيعي', fmt(abn.length), `<span class="${abn.length ? 'down' : 'up'}">${esc(abn.slice(0, 3).map(x => x.v).join('، ')) || 'لا يوجد'}</span>`, abn.length ? 'st-bad' : '')}
        ${kpi('قراءات ناقصة', fmt(miss.length), '<span class="mut">سجّلها ليُحسب المعدل</span>')}
      </div>
      ${card('المعدل الفعلي مقابل الطبيعي', 'كم لكل لتر؛ العلامة البيضاء هي المعدل الطبيعي للمركبة، واللون حسب الحالة',
        hbars(ss.map(x => [`${x.v} · ${x.vt}`, x.eff, STATUS[x.code][2], x.nat]), { dec: 1, unit: 'كم/لتر' }), 's7')}
      ${card('كفاءة الأسطول', '100% تعني أن الأسطول يستهلك بالضبط كما ينبغي', gaugeSVG(ratio, 'من المعدل الطبيعي', ratio >= 90 ? '#22A285' : ratio >= 75 ? '#E8B04B' : '#DD6A49'), 's5')}

      ${card(`ملخص ${c.name}`, c.kind === 'month' ? 'ملخص كل مركبة' : 'ملخص كل مركبة؛ المسافة من الأشهر التي لها قراءات عداد', this.sumTable(ss), 's12')}

  sumTable(s) {

        x.km ? fmt(x.km) + (x.roll ? ' <small class="mut">(العداد لفّ)</small>' : '') : '—', x.eff ? fmt(x.eff, 2) : '—', fmt(x.nat, 1), pill(x.code)]), { num: [2, 3, 4, 5, 6, 7] });
  },

  // ---------------- السند الشهري ----------------
  mon() {
    const lv = Data.level('diesel'), st = this.st.mon;
    const months = [...new Set([...this.monthsWithData(), ...lastMonths(13)])].sort().reverse();
    if (!st.month) st.month = thisMonth();
    const month = st.month, d = this.rows().filter(r => r.ym === month), a = this.st.add;
    const first = month + '-01', last = monthEnd(month) < today() ? monthEnd(month) : today();
    if (!a.date || a.date.slice(0, 7) !== month) a.date = month === thisMonth() ? today() : first;
    const addForm = lv < 2 ? '' : `<div class="card" style="margin-bottom:14px"><h3>إضافة تعبئة</h3><div id="ds-add-msg"></div>
      <div class="filters" style="margin:8px 0 0">
        ${sel('ds.add.veh', a.veh, Data.vehicles().map(x => [x.id, `${x.number} — ${x.type || ''}`]), { label: 'السيارة *', all: '— اختر —' })}
        ${sel('ds.add.drv', a.drv, Data.drivers().map(x => [x.id, x.name]), { label: 'السائق *', all: '— اختر —' })}
        <div class="f"><label>اللترات *</label><input type="number" min="1" step="1" inputmode="decimal" data-k="ds.add.lit" value="${esc(a.lit)}"></div>
        <div class="f"><label>التاريخ *</label><input type="date" data-k="ds.add.date" value="${a.date}" min="${first}" max="${last}"></div>
        <div class="f"><label>&nbsp;</label><button class="btn" data-act="ds-add">إضافة التعبئة</button></div></div></div>`;
    const tot = d.reduce((s, r) => s + r.l, 0);
    const list = d.length ? table(['التاريخ', 'السيارة', 'النوع', 'السائق', 'اللترات', 'سجّلها', ...(lv >= 3 ? [''] : [])],
      d.map(r => [r.date, esc(r.v), esc(r.vt), esc(r.d), `<b>${fmt(r.l)}</b>`, esc(r.by), ...(lv >= 3 ? [`<button class="btn ghost sm" data-act="ds-del" data-id="${r.id}">حذف</button>`] : [])]), { num: [4], max: 420 })
      : '<div class="empty">لا توجد تعبئات لهذا الشهر</div>';
    return `<div class="filters">${sel('ds.mon.month', month, months.map(m => [m, monthLabel(m)]), { label: 'الشهر' })}</div>${addForm}
      <div class="card" style="margin-bottom:14px"><h3>تعبئات شهر ${monthLabel(month)}</h3><div class="sub">${fmt(d.length)} تعبئة — ${fmt(tot)} لتر</div>${list}</div>
      <div class="card" style="margin-bottom:14px"><h3>قراءات العداد</h3><div class="sub">تُملأ قراءة البداية تلقائيًا من نهاية الشهر السابق إن وُجدت. لو العداد لفّ (من 9xx,xxx إلى رقم صغير) تُحسب المسافة صح.</div>
        <div id="ds-odo-msg"></div>${this.odoEditor(month, d, lv >= 2)}</div>
      <div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><h3>ملخص شهر ${monthLabel(month)}</h3>${d.length ? '<button class="btn ghost sm" data-act="ds-csv-month">⬇️ CSV</button>' : ''}</div>
        ${this.sumTable(this.summary(d, month))}</div>`;
  },
  odoEditor(month, d, can) {
    const cars = [...new Map(d.map(r => [r.vid, r])).values()].sort((a, b) => String(a.v).localeCompare(String(b.v)));
    if (!cars.length) return '<div class="empty">سجّل تعبئات الشهر أولًا، ثم أدخل قراءات العداد.</div>';
    const pm = prevMonth(month);
    const rows = cars.map(r => {
      const o = this.odo(month, r.vid), p = this.odo(pm, r.vid);
      const s = o && o.start_km !== null ? o.start_km : (p && p.end_km !== null ? p.end_km : ''), e = o && o.end_km !== null ? o.end_km : '';
      const lit = d.filter(x => x.vid === r.vid).reduce((a, x) => a + x.l, 0);
      return [esc(r.v) + ' — ' + esc(r.vt), fmt(lit),
        can ? `<input type="number" min="0" step="1" data-odo="${r.vid}" data-f="s" value="${s ?? ''}">` : (s === '' ? '—' : fmt(s)),
        can ? `<input type="number" min="0" step="1" data-odo="${r.vid}" data-f="e" value="${e ?? ''}">` : (e === '' ? '—' : fmt(e))];
    });
    return table(['السيارة', 'اللترات', 'بداية الشهر (كم)', 'نهاية الشهر (كم)'], rows, { num: [1], max: 600 }) +
      (can ? `<div style="margin-top:12px"><button class="btn" data-act="ds-save-odo">حفظ القراءات</button></div>` : '');
  },
  async addRefuel(btn) {
    const a = this.st.add, box = $('#ds-add-msg'), e = [], lit = parseFloat(a.lit);
    if (!a.veh) e.push('السيارة مطلوبة'); if (!a.drv) e.push('السائق مطلوب');
    if (!(lit > 0)) e.push('يجب أن تكون الكمية أكبر من صفر'); else if (lit > 1500) e.push('الكمية كبيرة جدًا، تحقق من الرقم');
    if (!a.date || a.date > today()) e.push('التاريخ غير صحيح');
    if (e.length) { box.innerHTML = `<div class="err">${e.join('<br>')}</div>`; return; }
    btn.disabled = true;
    try {
      const row = await API.insert('diesel_refuels', { date: a.date, vehicle_id: +a.veh, driver_id: +a.drv, liters: lit, created_by: Data.me.username, created_at: nowKw() });
      T.refuels.put(row);
      const v = Data.veh.get(+a.veh);
      log('diesel', 'إضافة تعبئة', `${v.number} — ${v.type} | ${fmt(lit)} | ${a.date}`);
      toast(`✓ تمت إضافة ${fmt(lit)} لترًا للسيارة ${v.number}`); a.lit = ''; App.render();
    } catch (er) { box.innerHTML = `<div class="err">${esc(arErr(er))}</div>`; btn.disabled = false; }
  },
  async saveOdo(btn) {
    const month = this.st.mon.month, box = $('#ds-odo-msg'), vals = new Map();
    for (const el of $$('[data-odo]')) { const vid = +el.dataset.odo, x = vals.get(vid) || {}; x[el.dataset.f] = el.value === '' ? null : +el.value; vals.set(vid, x); }
    const bad = [...vals.entries()].filter(([, x]) => x.s !== null && x.e !== null && x.e < x.s && !this.distance(x.s, x.e).roll).map(([vid]) => (Data.veh.get(vid) || {}).number);
    if (bad.length) { box.innerHTML = `<div class="err">قراءة النهاية أقل من البداية في: ${esc(bad.join('، '))}</div>`; return; }
    btn.disabled = true;
    try {
      const rows = [...vals.entries()].map(([vid, x]) => ({ month, vehicle_id: vid, start_km: x.s, end_km: x.e, updated_by: Data.me.username, updated_at: nowKw() }));
      await API.upsert('diesel_odometer', rows, 'month,vehicle_id');
      await T.odometer.sync(); log('diesel', 'حفظ قراءات العداد', month);
      toast(`✓ تم حفظ قراءات ${rows.length} سيارة`); App.render();
    } catch (er) { box.innerHTML = `<div class="err">${esc(arErr(er))}</div>`; btn.disabled = false; }
  },
  confirmDel(id) {
    const r = this.rows().find(x => x.id === id); if (!r) return;
    modal(`<h3>حذف تعبئة</h3><p>${esc(r.v)} — ${r.date} — ${fmt(r.l)} لتر — ${esc(r.d)}</p><p class="mut">لا يمكن التراجع عن الحذف.</p><div id="del-msg"></div>
      <div style="display:flex;gap:10px"><button class="btn danger" data-act="ds-do-del" data-id="${id}">نعم، احذف</button><button class="btn ghost" data-act="close">إلغاء</button></div>`, 480);
  },
  async doDel(id, btn) {
    const r = this.rows().find(x => x.id === id); btn.disabled = true;
    try { await API.remove('diesel_refuels', id); T.refuels.drop(id); log('diesel', 'حذف تعبئة', `${r.v} — ${r.date} — ${fmt(r.l)}`); closeModal(); toast('✓ تم الحذف'); App.render(); }
    catch (e) { $('#del-msg').innerHTML = `<div class="err">${esc(arErr(e))}</div>`; btn.disabled = false; }
  },

  // ---------------- الشهور ----------------
  months() {
    const lv = Data.level('diesel'), rows = this.rows(), g = new Map();
    for (const r of rows) { const x = g.get(r.ym) || { l: 0, n: 0, v: new Set(), d: new Set() }; x.l += r.l; x.n++; x.v.add(r.vid); x.d.add(r.did); g.set(r.ym, x); }
    const list = [...g.entries()].sort((a, b) => a[0] < b[0] ? 1 : -1);
    if (!list.length) return '<div class="empty">لا توجد شهور مسجلة</div>';
    return card('الشهور المسجّلة', `${list.length} شهر`, table(['الشهر', 'اللترات', 'التعبئات', 'السيارات', 'السائقون', 'قراءات العداد', ...(lv >= 3 ? [''] : [])],
      list.map(([m, x]) => [monthLabel(m), fmt(x.l), fmt(x.n), x.v.size, x.d.size, T.odometer.rows.filter(o => o.month === m).length,
        ...(lv >= 3 ? [`<button class="btn ghost sm" data-act="ds-del-month" data-m="${m}">حذف الشهر</button>`] : [])]), { num: [1, 2, 3, 4, 5], max: 700 }));
  },
  confirmDelMonth(m) {
    const n = this.rows().filter(r => r.ym === m).length; this.st.del.typed = ''; this._delMonth = m;
    modal(`<h3>حذف شهر ${monthLabel(m)} بالكامل</h3><div class="err">سيتم حذف ${fmt(n)} تعبئة وجميع قراءات العداد لشهر ${monthLabel(m)}. لا يمكن التراجع عن ذلك.</div>
      <div class="f"><label>اكتب <b dir="ltr">${m}</b> للتأكيد</label><input data-k="ds.del.typed" dir="ltr"></div><div id="del-msg"></div>
      <div style="display:flex;gap:10px;margin-top:12px"><button class="btn danger" data-act="ds-do-del-month">حذف الشهر</button><button class="btn ghost" data-act="close">إلغاء</button></div>`, 520);
  },
  async doDelMonth(btn) {
    const m = this._delMonth;
    if (this.st.del.typed.trim() !== m) { $('#del-msg').innerHTML = `<div class="err">اكتب ${m} بالظبط للتأكيد</div>`; return; }
    btn.disabled = true;
    try {
      const gone = await API.removeWhere('diesel_refuels', `date=gte.${m}-01&date=lte.${monthEnd(m)}`);
      await API.removeWhere('diesel_odometer', `month=eq.${m}`);
      T.refuels.drop(gone.map(x => x.id)); await T.odometer.sync();
      log('diesel', 'حذف شهر', `${m} | ${gone.length}`); closeModal(); toast(`✓ تم حذف ${gone.length} تعبئة من ${monthLabel(m)}`); App.render();
    } catch (e) { $('#del-msg').innerHTML = `<div class="err">${esc(arErr(e))}</div>`; btn.disabled = false; }
  },

  // ---------------- التقارير ----------------
  rep() {
    const st = this.st.q, all = this.rows(), [f, t] = presetRange(st, all.map(r => r.date));
    let d = all.filter(r => r.date >= f && r.date <= t);
    if (st.veh) d = d.filter(r => String(r.vid) === String(st.veh));
    if (st.drv) d = d.filter(r => String(r.did) === String(st.drv));
    const vehs = [...new Map(all.map(r => [r.vid, r.v])).entries()].sort((a, b) => String(a[1]).localeCompare(String(b[1])));
    const drvs = [...new Map(all.map(r => [r.did, r.d])).entries()].sort(byName);
    const lit = d.reduce((a, r) => a + r.l, 0);
    const agg = key => { const m = new Map(); for (const r of d) { const k = key(r); const x = m.get(k) || { l: 0, n: 0, o: new Set() }; x.l += r.l; x.n++; x.o.add(key === 'v' ? r.did : r.vid); m.set(k, x); } return [...m.entries()].sort((a, b) => b[1].l - a[1].l); };
    const byDrv = agg(r => r.d), byVeh = agg(r => r.v + ' — ' + r.vt), byMon = agg(r => r.ym).sort((a, b) => a[0] < b[0] ? 1 : -1);
    // تقرير كل مركبة (كل الشهور): المعدل الفعلي محسوب على الشهور التي لها قراءات كاملة
    const per = new Map();
    for (const r of all) { const x = per.get(r.vid) || { v: r.v, vt: r.vt, l: 0, ms: new Set() }; x.l += r.l; x.ms.add(r.ym); per.set(r.vid, x); }
    const perRows = [...per.entries()].map(([vid, x]) => {
      let km = 0, lm = 0;
      for (const m of x.ms) { const o = this.odo(m, vid); const dd = o ? this.distance(o.start_km, o.end_km) : { km: null }; if (dd.km) { km += dd.km; lm += all.filter(r => r.vid === vid && r.ym === m).reduce((a, r) => a + r.l, 0); } }
      const eff = lm ? km / lm : null, nat = this.natural(vid); return { ...x, eff, nat, code: this.status(eff, nat) };
    }).sort((a, b) => b.l - a.l);
    this._rep = { f, t, d };
    return `<div class="card" style="margin-bottom:14px"><h3>استعلام: لترات سائق أو سيارة خلال فترة</h3>
      <div class="filters" style="margin-top:8px">${periodControls('ds.q', st)}${sel('ds.q.veh', st.veh, vehs, { label: 'السيارة', all: 'الكل' })}${sel('ds.q.drv', st.drv, drvs, { label: 'السائق', all: 'الكل' })}</div>
      <div class="period"><span class="box">📅 ${spanText(f, t)}${st.veh ? ' — ' + esc((Data.veh.get(+st.veh) || {}).number) : ''}${st.drv ? ' — ' + esc((Data.emp.get(+st.drv) || {}).name) : ''}</span>
        ${d.length ? '<button class="btn ghost sm" data-act="ds-csv-q">⬇️ تنزيل التفاصيل (CSV)</button>' : ''}</div>
      ${d.length ? `<div class="grid g4" style="margin-bottom:12px">${kpi('إجمالي اللترات', fmt(lit), `<span class="mut">${fmt(d.length)} تعبئة</span>`)}${kpi('متوسط التعبئة', fmt(lit / d.length))}
        ${kpi('عدد الأيام', fmt(new Set(d.map(r => r.date)).size), '<span class="mut">أيام بها تعبئة</span>')}${kpi('السائقون / السيارات', `${new Set(d.map(r => r.did)).size} / ${new Set(d.map(r => r.vid)).size}`)}</div>
      <div class="grid g3">${card('حسب السائق', '', table(['السائق', 'اللترات', 'التعبئات', 'السيارات'], byDrv.map(([k, x]) => [esc(k), fmt(x.l), fmt(x.n), x.o.size]), { num: [1, 2, 3], max: 360 }))}
        ${card('حسب السيارة', '', table(['السيارة', 'اللترات', 'التعبئات'], byVeh.map(([k, x]) => [esc(k), fmt(x.l), fmt(x.n)]), { num: [1, 2], max: 360 }))}
        ${card('حسب الشهر', '', table(['الشهر', 'اللترات', 'التعبئات'], byMon.map(([k, x]) => [monthLabel(k), fmt(x.l), fmt(x.n)]), { num: [1, 2], max: 360 }))}</div>`
        : '<div class="empty">لا توجد تعبئات مطابقة</div>'}</div>
      ${card('تقرير كل مركبة (جميع الشهور)', 'المعدل الفعلي محسوب على الشهور التي لها قراءات عداد كاملة',
        table(['السيارة', 'النوع', 'إجمالي اللترات', 'عدد الشهور', 'المعدل الفعلي', 'المعدل الطبيعي', 'الحالة'],
          perRows.map(x => [esc(x.v), esc(x.vt), fmt(x.l), x.ms.size, x.eff ? fmt(x.eff, 2) : '—', fmt(x.nat, 1), pill(x.code)]), { num: [2, 3, 4, 5] }))}`;
  },

  // ---------------- الإعدادات ----------------
  set() {

      <div class="f"><button class="btn" data-act="ds-save-gen">حفظ المعدل العام</button></div></div></div>
      <div class="card"><h3>معدل خاص لكل مركبة</h3><div class="sub">اترك الخانة فارغة لتستخدم المركبة المعدل العام.</div><div id="ds-rate-msg"></div>
      ${table(['السيارة', 'النوع', 'المعدل (كم/لتر)'], vs.map(v => [esc(v.number), esc(v.type || ''), `<input type="number" min="0.1" max="50" step="0.1" data-rate="${v.id}" value="${v.diesel_rate ?? ''}">`]), { max: 700 })}
      <div style="margin-top:12px"><button class="btn" data-act="ds-save-rates">حفظ المعدلات</button></div></div>`;

  async saveGen(btn) {
    const v = parseFloat($('#ds-gen').value);
    if (!(v > 0 && v <= 50)) return toast('المعدل يجب أن يكون بين 0.1 و 50', true);
    btn.disabled = true;
    try { await API.upsert('settings', [{ key: 'diesel_general_rate', value: String(v) }], 'key'); await T.settings.sync(); log('diesel', 'تعديل المعدل العام', v); toast('✓ تم الحفظ'); App.render(); }
    catch (e) { toast(arErr(e), true); btn.disabled = false; }
  },
  async saveRates(btn) {
    const changes = [];
    for (const el of $$('[data-rate]')) {
      const id = +el.dataset.rate, v = Data.veh.get(id), nv = el.value === '' ? null : +el.value, ov = v.diesel_rate === null || v.diesel_rate === undefined ? null : +v.diesel_rate;
      if (nv !== null && !(nv > 0 && nv <= 50)) { $('#ds-rate-msg').innerHTML = `<div class="err">المعدل غير صحيح للسيارة ${esc(v.number)}</div>`; return; }
      if (nv !== ov) changes.push([id, nv]);
    }
    if (!changes.length) return toast('لا توجد تعديلات');
    btn.disabled = true;
    try {
      for (const [id, nv] of changes) { await API.update('vehicles', id, { diesel_rate: nv }); Data.veh.get(id).diesel_rate = nv; }
      Data.lv++; log('diesel', 'تعديل معدلات السيارات', changes.length); toast(`✓ تم حفظ ${changes.length} معدل`); App.render();
    } catch (e) { $('#ds-rate-msg').innerHTML = `<div class="err">${esc(arErr(e))}</div>`; btn.disabled = false; }
  },
  act: {
    'add': (t) => Diesel.addRefuel(t), 'save-odo': (t) => Diesel.saveOdo(t),

    'del-month': (t) => Diesel.confirmDelMonth(t.dataset.m), 'do-del-month': (t) => Diesel.doDelMonth(t),
    'save-gen': (t) => Diesel.saveGen(t), 'save-rates': (t) => Diesel.saveRates(t),
    'csv-month': () => { const m = Diesel.st.mon.month, s = Diesel.summary(Diesel.rows().filter(r => r.ym === m), m);

  // ---------------- التقارير ----------------
  rep() {
    const st = this.st.rep, [d, f, t] = this.filter(st);

    const total = d.reduce((s, r) => s + r.a, 0);
    const agg = (key, other) => { const m = new Map(); for (const r of d) { const k = key(r); const x = m.get(k) || { a: 0, n: 0, o: new Set() }; x.a += r.a; x.n++; x.o.add(other(r)); m.set(k, x); } return [...m.entries()].sort((a, b) => b[1].a - a[1].a); };

        ${kpi('السيارات', fmt(new Set(d.map(r => r.vid)).size))}${kpi('السائقون', fmt(new Set(d.map(r => r.did)).size))}</div>
      <div style="margin-bottom:14px"><button class="btn" data-act="cr-export-rep">⬇️ تنزيل كل الفواتير في الفترة (CSV)</button></div>
      ${card('السائق × السيارة (إجمالي المبالغ)', 'بالدينار الكويتي', heatTable(drivers, cars, (r, c) => pair.get(r + '|' + c) || 0, 'د.ك'))}
      <div class="grid g2" style="margin-top:14px">
        ${card('ترتيب السائقين', '', table(['السائق', 'الإجمالي', 'الفواتير', 'المتوسط', 'السيارات'], drv.map(([k, x]) => [esc(k), KWD(x.a), x.n, KWD(x.a / x.n), x.o.size]), { num: [1, 2, 3, 4], max: 460 }))}
        ${card('ترتيب السيارات', '', table(['السيارة', 'الإجمالي', 'الفواتير', 'المتوسط', 'السائقون'], car.map(([k, x]) => [esc(k), KWD(x.a), x.n, KWD(x.a / x.n), x.o.size]), { num: [1, 2, 3, 4], max: 460 }))}
      </div>`;
  },
  exportRows(rows, name) {
    download(name, [['رقم الفاتورة', 'التاريخ', 'رقم السيارة', 'نوع المركبة', 'الطراز', 'السائق', 'المبلغ (د.ك)', 'المشكلة', 'سجّلها'],
      ...rows.map(r => [r.no, r.date, r.v, r.vt, r.vm, r.d, r.a.toFixed(3), r.p, r.by])]);
  },
  act: {
    'save': (t) => Cars.save(t), 'save-edit': (t) => Cars.saveEdit(t),
    'edit': (t) => Cars.openEdit(+t.dataset.id), 'del': (t) => Cars.confirmDel(+t.dataset.id), 'do-del': (t) => Cars.doDel(+t.dataset.id, t),
    'pg': (t) => { Cars.st.list.page += +t.dataset.d; App.render(); },
    'export-list': () => Cars.exportRows(Cars.filter(Cars.st.list)[0], `maintenance_${today()}.csv`),
    'export-rep': () => { const R = Cars._rep; if (R) Cars.exportRows(R.d, `maintenance_report_${R.f}_${R.t}.csv`); },

// ============================================================================
// قسم البضاعة المسلّمة: مجموعات منتجات، داخل كل مجموعة بنود، ولكل مجموعة سندات بتاريخها
// ============================================================================
const GROUP_COLORS = ['#BC8726', '#4A8FDB', '#22A285', '#9177E8', '#DD6A49', '#C99A6B', '#7FA6B5', '#B5739D', '#8FA65A', '#D2A85F'];
const chgPill = c => c === null || c === undefined ? '<span class="mut">—</span>'
  : `<span class="pill ${c > 0.05 ? 'up' : c < -0.05 ? 'down' : 'mut'}" dir="ltr">${c > 0 ? '+' : ''}${fmt(c, 1)}%</span>`;
const chg = (a, b) => !b ? null : (a - b) / b * 100;
const prevN = (ym, n) => { for (let i = 0; i < n; i++) ym = prevMonth(ym); return ym; };

const Goods = {
  key: 'goods', title: 'البضاعة المسلّمة', icon: '📦', tables: ['ggroups', 'gitems', 'grec', 'glines'],
  st: {
    tab: LS.get('qw_gd_tab', 'dash'),
    dash: { fac: '', wh: '', kind: 'month', p: '' },
    add: { fac: LS.get('qw_gd_fac', ''), wh: LS.get('qw_gd_wh', '') },
    list: { preset: 'month', f: '', t: '', fac: '', wh: '', grp: '', q: '', page: 0 },
    rep: { fac: '', wh: '', f: '', t: '' },
    set: { gid: '' },
    edit: {},
  },
  draft: {},
  toolsOpen: new Set(),   // قوائم «تعديل المجموعة» التي فتحها المستخدم بنفسه (تبقى كما تركها)   // ما يكتبه المستخدم في سندات المجموعات قبل الحفظ (لا يضيع عند التحديث)
  quiet(grp, k) { return grp === 'edit' && k !== 'fac'; },

  // ---------------- البيانات ----------------
  groups(all = true) {
    return T.ggroups.rows.filter(g => all || g.active).sort((a, b) => a.sort - b.sort || a.id - b.id);
  },
  colors() { const m = new Map(); this.groups().forEach((g, i) => m.set(g.id, GROUP_COLORS[i % GROUP_COLORS.length])); return m; },
  items(gid, keep = []) {
    return T.gitems.rows.filter(i => i.group_id === gid && (i.active || keep.includes(i.id))).sort((a, b) => a.sort - b.sort || a.id - b.id);
  },
  facName(id) { const f = Data.fac.get(id); return f ? f.name : 'غير محدد'; },
  // كل السندات مع بنودها
  recs() {
    const v = [T.grec.v, T.glines.v, T.ggroups.v, T.gitems.v, Data.lv].join('.');
    if (this._v === v) return this._recs;
    const G = new Map(T.ggroups.rows.map(g => [g.id, g])), I = new Map(T.gitems.rows.map(i => [i.id, i])), L = new Map();
    for (const l of T.glines.rows) { if (!L.has(l.record_id)) L.set(l.record_id, []); L.get(l.record_id).push(l); }
    this._recs = T.grec.rows.map(r => {
      const g = G.get(r.group_id) || { name: '?', sort: 999 };
      const lines = (L.get(r.id) || []).map(l => { const it = I.get(l.item_id) || { name: '?', sort: 999 }; return { iid: l.item_id, item: it.name, isort: it.sort, qty: +l.qty || 0 }; })
        .sort((a, b) => a.isort - b.isort || a.iid - b.iid);
      return { id: r.id, no: r.record_no, date: r.date, ym: r.date.slice(0, 7), gid: r.group_id, g: g.name, gsort: g.sort, fid: r.factory_id, fac: this.facName(r.factory_id), wid: r.warehouse_id, wh: r.warehouse_id ? (Data.wh.get(r.warehouse_id) || {}).name || '?' : '',
        notes: r.notes || '', by: r.created_by || '', lines, total: lines.reduce((s, l) => s + l.qty, 0) };
    }).sort((a, b) => a.date < b.date ? 1 : a.date > b.date ? -1 : b.id - a.id);
    this._v = v; return this._recs;
  },
  facPicker(path, cur, recs) {
    const ids = [...new Set(recs.map(r => r.fid))];
    return sel(path, cur, ids.map(id => [id ?? 'none', this.facName(id)]), { label: 'المصنع', all: 'كل المصانع' });
  },
  // المخزن: يُسأل عنه فقط لمصنع المواد العازلة (الاستايروبور)، مثل قسم الأوردرات
  usesStore(fid) { const f = Data.fac.get(+fid); return !!(f && /ستايروبور|المواد العازلة/.test(f.name)); },
  whOptions(keep) { return [...Data.wh.values()].filter(w => w.active || w.id === keep).sort((a, b) => a.id - b.id).map(w => [w.id, w.name]); },
  // فلتر المصنع ثم المخزن (فلتر المخزن يظهر بعد اختيار الاستايروبور)
  pickers(path, st, recs) {
    let h = this.facPicker(path + '.fac', st.fac, recs);
    if (st.fac && this.usesStore(st.fac)) { const ids = [...new Set(recs.filter(r => String(r.fid) === String(st.fac)).map(r => r.wid ?? 'none'))];
      h += sel(path + '.wh', st.wh, ids.map(id => [id, id === 'none' ? 'غير محدد' : (Data.wh.get(id) || {}).name || '?']), { label: 'المخزن', all: 'كل المخازن' }); }
    return h;
  },
  byFac(recs, fac, wh = '') { let r = fac ? recs.filter(x => String(x.fid ?? 'none') === String(fac)) : recs; if (fac && wh) r = r.filter(x => String(x.wid ?? 'none') === String(wh)); return r; },

  render() {
    const lv = Data.level('goods');

    const tabs = [['dash', 'لوحة المعلومات'], ...(lv >= 2 ? [['add', 'تسجيل سند']] : []), ['list', 'السندات'], ['rep', 'التقارير'], ...(lv >= 3 ? [['set', 'المجموعات والبنود']] : [])];

  // ---------------- لوحة المعلومات ----------------
  dash() {
    const st = this.st.dash, all = this.recs();
    if (!all.length) return `<div class="card hero"><h2>لا توجد سندات بعد</h2><p>ابدأ من تبويب «تسجيل سند»: لكل مجموعة سند بتاريخه وكميات بنودها.</p></div>`;
    const recs = this.byFac(all, st.fac, st.wh), c = cmpPeriod(st, all.map(r => r.date)), col = this.colors();
    const head = `<div class="filters">${this.pickers('gd.dash', st, all)}${periodPicker('gd.dash', st, c)}</div>${cmpHead(c)}`;
    if (!recs.length) return head + `<div class="card hero"><h2>لا توجد سندات لهذا المصنع</h2></div>`;
    const inP = (f, t) => recs.filter(r => r.date >= f && r.date <= t), sumOf = rs => { const x = new Map(); for (const r of rs) x.set(r.gid, (x.get(r.gid) || 0) + r.total); return x; };
    const curR = inP(c.f, c.t), lyR = inP(c.pf, c.pt), cur = sumOf(curR), prev = sumOf(lyR), hasPrev = lyR.length > 0;
    const tot = x => [...x.values()].reduce((s, v) => s + v, 0);
    const total = tot(cur), ptotal = hasPrev ? tot(prev) : null, ch = chg(total, ptotal);
    const present = this.groups().filter(g => recs.some(r => r.gid === g.id));
    const ranked = present.filter(g => cur.get(g.id)).sort((a, b) => cur.get(b.id) - cur.get(a.id));
    const top = ranked[0], nRec = curR.length;
    const months12 = lastMonths(12, c.t.slice(0, 7)), mon = new Map(months12.map(x => [x, sumOf(recs.filter(r => r.ym === x))]));
    const delta = (v, pv) => !hasPrev ? '<span class="mut">لا توجد بيانات في نفس الفترة من العام الماضي</span>' : `<span class="mut">العام الماضي ${fmt(pv)}</span> ${chgPill(chg(v, pv))}`;
    const it = new Map(); for (const r of curR) for (const l of r.lines) { const k = r.gid + '|' + l.iid; const o = it.get(k) || { n: l.item === r.g ? l.item : `${l.item} · ${r.g}`, q: 0, c: col.get(r.gid) }; o.q += l.qty; it.set(k, o); }
    const itArr = [...it.values()].sort((a, b) => b.q - a.q);
    const notes = [];
    if (hasPrev) {
      const d = present.map(g => [g.name, (cur.get(g.id) || 0) - (prev.get(g.id) || 0)]).sort((a, b) => b[1] - a[1]);
      if (d.length && d[0][1] > 0) notes.push(['ok', `أكبر زيادة عن العام الماضي في <b>${esc(d[0][0])}</b> (+${fmt(d[0][1])}).`]);
      if (d.length && d[d.length - 1][1] < 0) notes.push(['warnbox', `أكبر انخفاض عن العام الماضي في <b>${esc(d[d.length - 1][0])}</b> (${fmt(d[d.length - 1][1])}).`]);
    }
    const zero = present.filter(g => !cur.get(g.id)).map(g => g.name);
    if (zero.length) notes.push(['infobox', `مجموعات بلا سندات في هذه الفترة: ${zero.map(esc).join('، ')}.`]);
    const lyCol = c.partial ? spanText(c.pf, c.pt) : c.lyName;
    const sumRows = present.map(g => { const v = cur.get(g.id) || 0, pv = prev.get(g.id) || 0;
      return [`<i class="dot" style="background:${col.get(g.id)}"></i>${esc(g.name)}`, fmt(v), hasPrev ? fmt(pv) : '—', hasPrev ? chgPill(chg(v, pv)) : '—']; });
    sumRows.push(['<b>الإجمالي</b>', `<b>${fmt(total)}</b>`, hasPrev ? fmt(ptotal) : '—', hasPrev ? chgPill(ch) : '—']);
    return head + `<div class="grid g12">
      <div class="card hero s12"><h2>البضاعة المسلّمة في ${c.name}: <bdi>${fmt(total)}</bdi> قطعة</h2>
        <p>${top ? `أعلى مجموعة <b>${esc(top.name)}</b> بنسبة ${fmt(cur.get(top.id) / total * 100)}% من الإجمالي.` : 'لا توجد كميات في هذه الفترة.'}${ch !== null ? ` مقارنة بنفس الفترة من العام الماضي: <span dir="ltr">${ch > 0 ? '+' : ''}${fmt(ch, 1)}%</span>.` : ''}</p>
        <div class="chips"><span class="chip">${ranked.length} مجموعات</span><span class="chip">${nRec} سندًا</span>${ptotal !== null ? `<span class="chip">العام الماضي ${fmt(ptotal)}</span>` : ''}</div></div>
      <div class="s12 grid g4">
        ${kpi('الإجمالي الكلي', fmt(total), delta(total, ptotal))}
        ${ranked.slice(0, 3).map(g => kpi(`<i class="dot" style="background:${col.get(g.id)}"></i>${esc(g.name)}`, fmt(cur.get(g.id)), delta(cur.get(g.id), prev.get(g.id) || 0))).join('')}
      </div>
      ${card('الإجمالي الشهري حسب المجموعة', 'آخر 12 شهرًا حتى نهاية الفترة', stackSVG(months12.map(mshort), present.map(g => [g.name, months12.map(x => mon.get(x).get(g.id) || 0), col.get(g.id)]), { unit: 'قطعة', w: 1000, h: 280 }), 's12')}
      ${card(`البنود في ${c.name}`, 'كل بند بلون مجموعته', hbars(itArr.map(x => [x.n, x.q, x.c])), 's7')}
      ${card('حصة المجموعات', c.name, donutSVG(ranked.map(g => [g.name, cur.get(g.id), col.get(g.id)]), fmt(total), 'قطعة'), 's5')}
      ${card(`ملخص ${c.name}`, 'مقارنة بنفس الفترة من العام الماضي', table(['المجموعة', c.partial ? spanText(c.f, c.t) : c.name, lyCol, 'التغير'], sumRows, { num: [1, 2] }), 's12')}
      ${card('ملاحظات', '', notes.length ? notes.map(([k, t]) => `<div class="${k}">${t}</div>`).join('') : '<div class="mut">لا توجد ملاحظات</div>', 's12')}
      </div>`;
  },

  // ---------------- تسجيل سند ----------------

  dr(gid) { return this.draft[gid] || (this.draft[gid] = { date: today(), notes: '', q: {} }); },
  add() {

        <div class="filters" style="margin:0 0 10px"><div class="f"><label>تاريخ السند</label><input type="date" data-gd="${g.id}" value="${esc(d.date)}" max="${today()}"></div></div>
        <div class="qgrid">${its.map(i => `<div class="f"><label>${esc(i.name)}</label><input type="number" min="0" step="1" inputmode="numeric" data-gq="${g.id}:${i.id}" value="${esc(d.q[i.id] ?? '')}" placeholder="0"></div>`).join('')}</div>
        <div class="f" style="margin-top:10px"><label>ملاحظات (اختياري)</label><input data-gn="${g.id}" value="${esc(d.notes)}"></div>
        <div class="inrow" style="justify-content:space-between;align-items:center"><span>إجمالي ${esc(g.name)}: <b id="gt-${g.id}">${fmt(tot)}</b></span>
          <button class="btn" data-act="gd-save" data-g="${g.id}">حفظ سند ${esc(g.name)}</button></div>

          <div class="sub" style="margin:12px 0 0">البنود: عدّل الاسم ثم «حفظ»، أو «إيقاف» لإخفائه من السند مع بقاء أرقامه القديمة، أو «حذف» لو لم تُسجَّل له كميات أبدًا.</div>

          <div class="mut" style="font-size:12px;margin-top:6px">البنود الموقوفة والترتيب: من تبويب «المجموعات والبنود».</div></details>` : ''}
      </div>`; }).join('')}</div>`;
  },
  qtyErr(vals) {

  apply(res, oldId = null) {

  },

  // ---------------- التقارير ----------------
  rep() {
    const st = this.st.rep, all = this.recs();
    if (!all.length) return '<div class="empty">لا توجد بيانات</div>';
    const recs0 = this.byFac(all, st.fac, st.wh), months = [...new Set(all.map(r => r.ym))].sort();
    if (!months.includes(st.t)) st.t = months[months.length - 1];
    if (!months.includes(st.f)) st.f = months[Math.max(0, months.length - 12)];
    const head = `<div class="filters">${this.pickers('gd.rep', st, all)}${sel('gd.rep.f', st.f, months.map(m => [m, monthLabel(m)]), { label: 'من شهر' })}${sel('gd.rep.t', st.t, months.map(m => [m, monthLabel(m)]), { label: 'إلى شهر' })}</div>`;
    const recs = recs0.filter(r => r.ym >= st.f && r.ym <= st.t);
    if (!recs.length) return head + '<div class="warnbox">لا توجد بيانات في هذه الفترة</div>';
    const ms = [...new Set(recs.map(r => r.ym))].sort();
    const gp = new Map(), ip = new Map();
    for (const r of recs) for (const l of r.lines) {
      const gk = r.gid; if (!gp.has(gk)) gp.set(gk, { name: r.g, s: r.gsort, m: {} }); const g = gp.get(gk); g.m[r.ym] = (g.m[r.ym] || 0) + l.qty;
      const ik = r.gid + '|' + l.iid; if (!ip.has(ik)) ip.set(ik, { g: r.g, s: r.gsort, is: l.isort, name: l.item, m: {} }); const i = ip.get(ik); i.m[r.ym] = (i.m[r.ym] || 0) + l.qty;
    }
    const sum = o => ms.reduce((s, m) => s + (o.m[m] || 0), 0);
    const G = [...gp.values()].sort((a, b) => a.s - b.s), I = [...ip.values()].sort((a, b) => a.s - b.s || a.is - b.is);
    const total = recs.reduce((s, r) => s + r.total, 0);
    this._rep = { ms, G, I, f: st.f, t: st.t };
    return head + `<div class="grid g4" style="margin-bottom:14px">${kpi('إجمالي الفترة', fmt(total))}${kpi('السندات', fmt(recs.length))}${kpi('المجموعات', fmt(G.length))}${kpi('الأشهر', fmt(ms.length))}</div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px"><button class="btn" data-act="gd-export-groups">⬇️ تنزيل حسب المجموعة (CSV)</button><button class="btn ghost" data-act="gd-export-items">⬇️ تنزيل حسب البند (CSV)</button></div>
      ${card('إجمالي كل مجموعة شهريًا', '', table(['المجموعة', ...ms.map(monthLabel), 'الإجمالي'], [...G.map(g => [esc(g.name), ...ms.map(m => fmt(g.m[m] || 0)), `<b>${fmt(sum(g))}</b>`]),
        ['<b>الإجمالي</b>', ...ms.map(m => `<b>${fmt(G.reduce((s, g) => s + (g.m[m] || 0), 0))}</b>`), `<b>${fmt(total)}</b>`]], { num: ms.map((_, i) => i + 1).concat(ms.length + 1) }))}
      <div style="height:14px"></div>
      ${card('تفصيل البنود', '', table(['المجموعة', 'البند', ...ms.map(monthLabel), 'الإجمالي'], I.map(i => [esc(i.g), esc(i.name), ...ms.map(m => fmt(i.m[m] || 0)), `<b>${fmt(sum(i))}</b>`]), { num: ms.map((_, i) => i + 2).concat(ms.length + 2), max: 700 }))}`;
  },

  },
  // يحفظ الصفوف التي تغيّرت فقط
  async saveRows(sel_, table, cur, toPatch, box, what) {
    const changes = [];
    for (const tr of $$(sel_)) {
      const id = +(tr.dataset.sg || tr.dataset.si), o = cur.find(x => x.id === id), p = toPatch(tr);
      if (!p.name) { box.innerHTML = '<div class="err">يوجد اسم فارغ</div>'; return; }
      if (Object.keys(p).some(k => String(p[k]) !== String(o[k]))) changes.push([id, p]);
    }
    if (!changes.length) { toast('لا توجد تغييرات'); return; }
    try {
      for (const [id, p] of changes) { const row = await API.update(table, id, p); T[table === 'goods_groups' ? 'ggroups' : 'gitems'].put(row); }
      log('goods', what, `${changes.length} صف`); toast('✓ تم الحفظ'); App.render();
    } catch (e) { box.innerHTML = `<div class="err">${e.code === '23505' ? 'يوجد اسم مكرر' : esc(arErr(e))}</div>`; await App.sync(true); }
  },

      ...R.I.map(i => [i.g, i.name, ...R.ms.map(m => i.m[m] || 0), R.ms.reduce((s, m) => s + (i.m[m] || 0), 0)])]); },

      sort: +$('[data-f=sort]', tr).value || 0, active: $('[data-f=active]', tr).checked ? 1 : 0 }), $('#si-msg'), 'تعديل البنود'),
    'add-group': async () => {

  ok: ['🟢 صالح', 'st-good', 3], none: ['⚪ دون تاريخ انتهاء', 'st-miss', 4]};

// أشرطة أفقية مكدّسة؛ rows: [الاسم، [[القيمة، اللون، الوصف]...]]
function hstack(rows, unit = '') {
  if (!rows.length) return '<div class="empty">لا توجد بيانات</div>';
  const max = Math.max(...rows.map(r => r[1].reduce((s, x) => s + x[0], 0)), 1);
  return '<div class="bars">' + rows.map(([k, parts]) => { const t = parts.reduce((s, x) => s + x[0], 0);
    return `<div class="hb"><span class="k" title="${esc(k)}">${esc(k)}</span><span class="t" style="display:flex;overflow:hidden">${parts.filter(p => p[0] > 0).map(([v, c, l]) =>
      `<i style="position:static;display:block;width:${(v / max * 100).toFixed(2)}%;background:${c};border-radius:0" title="${esc(l)}: ${fmt(v, 1)} ${unit}"></i>`).join('')}</span><span class="n">${fmt(t, 1)}</span></div>`; }).join('') + '</div>';
}

const Materials = {
  key: 'materials', title: 'صلاحية المواد الخام', icon: '🧪', tables: ['batches', 'issues', 'mats', 'prodwh', 'settings'],

    issue: { no: '', fac: LS.get('qw_mt_fac', ''), date: '', batch: '', dest: '', qty: '', notes: '' },

        prod: b.prod_date || '', exp: b.expiry_date || '', arr: b.arrival_date || '', w: +b.weight_per_bag || 0, bags: +b.bags || 0, total: +b.total_qty || 0, issued: iss,
        rem: (+b.total_qty || 0) - iss, notes: b.notes || '', parent: b.parent_batch_id, code, left }; })

  },
  issues() {

    this._i = T.issues.rows.map(i => { const b = B.get(i.batch_id) || {}, m = M.get(b.material_id) || { name: '?' }, fid = i.factory_id ?? b.factory_id;
      return { id: i.id, no: i.issue_no, date: i.date, ym: i.date.slice(0, 7), bid: i.batch_id, bno: b.batch_no || '?', mat: m.name, mdesc: m.description || '', wh: this.whName(b.warehouse_id),

    const inP = (rows, col, f, t) => rows.filter(r => r[col] >= f && r[col] <= t);
    const recvB = B.filter(b => !b.parent), pOut = inP(prod, 'date', c.f, c.t).reduce((s, i) => s + i.qty, 0), pOutLY = inP(prod, 'date', c.pf, c.pt);
    const pIn = inP(recvB, 'arr', c.f, c.t).reduce((s, b) => s + b.total, 0), pInLY = inP(recvB, 'arr', c.pf, c.pt);
    if (!B.length) return head + '<div class="card hero"><h2>لا توجد دفعات لهذا المصنع</h2></div>';
    const [warn] = this.thr(), act = B.filter(b => b.rem > 0.0001), stock = act.reduce((s, b) => s + b.rem, 0);
    const exp = act.filter(b => b.code === 'expired'), soon = act.filter(b => b.code === 'urgent' || b.code === 'soon');
    const expQ = exp.reduce((s, b) => s + b.rem, 0), soonQ = soon.reduce((s, b) => s + b.rem, 0);
    const d90 = addDays(today(), -90), rate = prod.filter(i => i.date >= d90).reduce((s, i) => s + i.qty, 0) / 3;
    const nWh = new Set(act.map(b => b.wid)).size, validPct = stock ? (stock - expQ) / stock * 100 : 0;
